<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080d12">
  <title>Concordium GBA</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/concordium-exploracao.css?v=20260619f">
</head>
<body>
  <main class="gba-shell is-playing">
    <header class="gba-topbar">
      <a href="/" class="gba-icon" aria-label="Voltar ao hub">&lt;</a>
      <section class="gba-roster" aria-label="Jogadores online">
        <div class="gba-roster-title">
          <strong>Jogadores online</strong>
          <span id="gba-save-status">Save automatico preparando</span>
        </div>
        <div id="gba-player-list" class="gba-player-list"></div>
      </section>
    </header>

    <section class="gba-stage" aria-label="Emulador Game Boy Advance">
      <div id="game"></div>
      <div id="gba-online-layer" class="gba-online-layer" aria-hidden="true"></div>
      <div id="gba-loading" class="gba-loading">Carregando Concordium...</div>
    </section>

    <dialog id="gba-player-dialog" class="gba-player-dialog">
      <form method="dialog">
        <button class="gba-dialog-close" value="close" aria-label="Fechar">x</button>
      </form>
      <h2 id="gba-player-name">Jogador</h2>
      <dl>
        <div><dt>Mapa</dt><dd id="gba-player-map">-</dd></div>
        <div><dt>Equipe Pokemon</dt><dd id="gba-player-team">-</dd></div>
        <div><dt>Insignias</dt><dd id="gba-player-badges">-</dd></div>
        <div><dt>Sincronizacao</dt><dd id="gba-player-sync">-</dd></div>
      </dl>
    </dialog>
  </main>

  <script src="/assets/concordium-exploracao.js?v=20260619f"></script>
</body>
</html>
