<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tower Defense</title>
<link rel="stylesheet" href="/assets/guardioes/game.css">
</head>
<body>
  <main class="game-shell" aria-label="Tower Defense">
    <aside class="desktop-rail desktop-rail-left" aria-hidden="true">
      <div class="rail-kicker">Tower Defense</div>
      <div class="rail-title">Defesa da Fortaleza</div>
      <div class="rail-line"></div>
      <div class="rail-copy">Estrada, torres e ondas em campo vertical preservado.</div>
    </aside>

    <section class="game-stage" aria-label="Campo de jogo">
      <div id="game-root"></div>
    </section>

    <aside class="desktop-rail desktop-rail-right" aria-hidden="true">
      <div class="rail-medallion"></div>
      <div class="rail-title small">Campanha</div>
      <div class="rail-copy">Gere torres, posicione, reposicione e funda durante a batalha.</div>
      <div class="rail-line"></div>
      <div class="rail-copy muted">Mobile primeiro. PC com tela expandida.</div>
    </aside>
  </main>

  <script src="/assets/guardioes/vendor/phaser.min.js"></script>
  <script src="/assets/guardioes/js/data.js"></script>
  <script src="/assets/guardioes/js/save.js"></script>
  <script src="/assets/guardioes/js/audio.js"></script>
  <script src="/assets/guardioes/js/orientation.js"></script>
  <script src="/assets/guardioes/js/ui-kit.js"></script>
  <script src="/assets/guardioes/js/scenes/boot.js"></script>
  <script src="/assets/guardioes/js/scenes/menu.js"></script>
  <script src="/assets/guardioes/js/scenes/levelselect.js"></script>
  <script src="/assets/guardioes/js/scenes/build.js"></script>
  <script src="/assets/guardioes/js/scenes/collection.js"></script>
  <script src="/assets/guardioes/js/scenes/classtree.js"></script>
  <script src="/assets/guardioes/js/scenes/shop.js"></script>
  <script src="/assets/guardioes/js/scenes/battle.js"></script>
  <script src="/assets/guardioes/js/main.js"></script>
</body>
</html>
