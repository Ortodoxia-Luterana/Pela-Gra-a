<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Herói Ortodoxo | Ortodoxia Luterana Gaming</title>
    <style>
      :root {
        --sky: #77c9f4;
        --sand: #f4c968;
        --sand-dark: #c98a32;
        --ink: #1e2432;
        --ink-soft: #41495d;
        --cream: #fff7da;
        --paper: #ffe9a6;
        --gold: #ffc645;
        --gold-2: #f1922e;
        --red: #e9574c;
        --green: #54b95f;
        --blue: #32a2de;
        --violet: #8c62d9;
        --panel: rgba(255, 247, 218, 0.94);
        --panel-dark: rgba(35, 37, 50, 0.92);
        --line: rgba(93, 62, 25, 0.22);
        --shadow: 0 18px 45px rgba(76, 45, 12, 0.28);
        --soft-shadow: 0 9px 0 rgba(101, 57, 19, 0.24);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 6%, rgba(255, 255, 255, 0.86), transparent 18rem),
          linear-gradient(180deg, #8bd9ff 0%, #ffe4a0 58%, #c97931 100%);
        overflow-x: hidden;
        touch-action: manipulation;
      }

      button, a { font: inherit; }
      button {
        border: 0;
        cursor: pointer;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      .hidden { display: none !important; }

      .shell {
        width: min(100vw, 520px);
        min-height: 100svh;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
        background: #f5c263;
        box-shadow: 0 0 0 1px rgba(72, 41, 15, 0.18), 0 28px 90px rgba(54, 34, 18, 0.35);
      }

      .stage {
        min-height: 100svh;
        position: relative;
        isolation: isolate;
        padding: max(12px, env(safe-area-inset-top)) 12px calc(92px + env(safe-area-inset-bottom));
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,196,76,0.08) 48%, rgba(74,34,15,0.22)),
          url("/assets/heroi-ortodoxo-hub.png?v=20260710b") center top / cover no-repeat;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 245, 183, 0.08), transparent 34%),
          radial-gradient(circle at 50% 52%, transparent 0 13rem, rgba(92, 44, 12, 0.18) 31rem);
      }

      .top-hud {
        display: grid;
        gap: 8px;
        position: relative;
        z-index: 20;
      }

      .profile-strip {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .avatar {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 44% 36%, #fff8ca 0 16%, transparent 17%),
          radial-gradient(circle at 37% 41%, #27314a 0 4%, transparent 5%),
          radial-gradient(circle at 61% 41%, #27314a 0 4%, transparent 5%),
          linear-gradient(145deg, #65cf77, #25a6d1);
        border: 4px solid #fff7ce;
        box-shadow: 0 4px 0 rgba(54, 36, 21, 0.24), 0 0 0 2px rgba(69, 47, 26, 0.18);
        position: relative;
      }

      .avatar::after {
        content: attr(data-level);
        position: absolute;
        right: -7px;
        bottom: -6px;
        min-width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: linear-gradient(#ffe474, #f5962f);
        border: 2px solid #fff7ce;
        font-weight: 1000;
        font-size: 0.78rem;
        color: #55300e;
      }

      .name-card {
        min-width: 0;
        border-radius: 16px;
        padding: 7px 11px;
        background: rgba(32, 37, 52, 0.88);
        color: #fff8d5;
        box-shadow: 0 5px 0 rgba(24, 27, 38, 0.32);
        border: 2px solid rgba(255, 247, 206, 0.2);
      }

      .name-card strong {
        display: block;
        font-size: 1rem;
        line-height: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .xp-track {
        height: 10px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.22);
        overflow: hidden;
      }

      .xp-track span {
        display: block;
        height: 100%;
        width: var(--xp, 24%);
        border-radius: inherit;
        background: linear-gradient(90deg, #79e26d, #ffe16f);
      }

      .round-action {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 1000;
        background: linear-gradient(#fff1a9, #ffc045);
        border: 3px solid #fff7ce;
        box-shadow: var(--soft-shadow);
        color: #56320e;
      }

      .resources {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
      }

      .resource {
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border-radius: 999px;
        background: rgba(32, 37, 52, 0.9);
        color: #fff7dd;
        font-size: 0.78rem;
        font-weight: 1000;
        box-shadow: 0 4px 0 rgba(24, 27, 38, 0.28);
        border: 2px solid rgba(255, 247, 206, 0.16);
      }

      .gem, .coin, .energy, .scroll {
        width: 20px;
        height: 20px;
        display: inline-block;
        flex: 0 0 auto;
        filter: drop-shadow(0 2px 0 rgba(0,0,0,0.22));
      }
      .energy {
        border-radius: 50% 50% 44% 44%;
        background: radial-gradient(circle at 55% 30%, #fff5a7 0 16%, transparent 17%), linear-gradient(145deg, #f94c4c, #b71f25);
      }
      .gem {
        clip-path: polygon(50% 0, 95% 28%, 78% 100%, 22% 100%, 5% 28%);
        background: linear-gradient(145deg, #87edff, #2354df);
      }
      .coin {
        border-radius: 50%;
        background: radial-gradient(circle at 38% 30%, #fff59f 0 16%, transparent 17%), linear-gradient(145deg, #ffd85b, #ea8d20);
      }
      .scroll {
        border-radius: 7px;
        background: linear-gradient(90deg, #fff8cc, #e5b86b);
        border: 2px solid #a0692a;
      }

      .home-view {
        min-height: calc(100svh - 166px);
        position: relative;
        z-index: 4;
      }

      .chapter-pin {
        position: absolute;
        top: 88px;
        left: 50%;
        translate: -50% 0;
        width: min(78%, 350px);
        border-radius: 17px;
        padding: 8px 14px 10px;
        background: rgba(42, 44, 58, 0.9);
        color: #fff8db;
        text-align: center;
        box-shadow: 0 7px 0 rgba(22, 24, 34, 0.3);
        border: 2px solid rgba(255, 247, 206, 0.22);
      }

      .chapter-pin b {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #ffe67c;
      }

      .chapter-pin span {
        display: block;
        margin-top: 2px;
        font-size: 1rem;
        font-weight: 1000;
      }

      .hotspot {
        position: absolute;
        min-width: 84px;
        min-height: 66px;
        border-radius: 18px;
        padding: 8px 9px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 4px;
        color: #fff9dd;
        text-shadow: 0 2px 0 rgba(65, 36, 18, 0.45);
        background: rgba(51, 44, 40, 0.48);
        border: 2px solid rgba(255, 251, 218, 0.56);
        box-shadow: 0 8px 18px rgba(64, 40, 17, 0.2);
        backdrop-filter: blur(2px);
      }

      .hotspot::before {
        content: attr(data-icon);
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: #4f2d10;
        background: linear-gradient(#fff3a4, #f49b2e);
        border: 2px solid rgba(255,255,255,0.8);
        box-shadow: 0 4px 0 rgba(69, 39, 16, 0.24);
        font-weight: 1000;
      }

      .hotspot span {
        font-size: 0.79rem;
        line-height: 1;
        font-weight: 1000;
      }

      .hotspot small {
        position: absolute;
        top: -9px;
        right: -8px;
        min-width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #ff4264;
        color: white;
        border: 2px solid #fff1bf;
        font-size: 0.72rem;
        font-weight: 1000;
      }

      .hotspot.summon { top: 218px; left: 18px; }
      .hotspot.heroes { top: 252px; right: 18px; }
      .hotspot.formation { top: 404px; left: 18px; }
      .hotspot.campaign { top: 386px; right: 18px; }
      .hotspot.checkin { top: 546px; right: 22px; }

      .party-yard {
        position: absolute;
        left: 50%;
        top: 548px;
        translate: -50% 0;
        width: min(82%, 390px);
        height: 110px;
      }

      .chibi {
        position: absolute;
        width: 58px;
        height: 76px;
        animation: bob 2.5s ease-in-out infinite;
        filter: drop-shadow(0 7px 0 rgba(72, 40, 16, 0.16));
      }

      .chibi:nth-child(2) { animation-delay: -0.8s; }
      .chibi:nth-child(3) { animation-delay: -1.5s; }

      .chibi .head {
        position: absolute;
        top: 0;
        left: 11px;
        width: 36px;
        height: 34px;
        border-radius: 46% 46% 50% 50%;
        background: #ffd49b;
        border: 3px solid #5b3723;
      }

      .chibi .head::before,
      .chibi .head::after {
        content: "";
        position: absolute;
        top: 13px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #272437;
      }
      .chibi .head::before { left: 8px; }
      .chibi .head::after { right: 8px; }

      .chibi .body {
        position: absolute;
        top: 29px;
        left: 7px;
        width: 45px;
        height: 44px;
        border-radius: 15px 15px 19px 19px;
        background: var(--robe, #49a6dd);
        border: 3px solid #5b3723;
      }

      .chibi .body::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 10px;
        width: 17px;
        height: 10px;
        border-radius: 999px;
        background: #ffd49b;
        border: 3px solid #5b3723;
      }

      .chibi .body::after {
        content: "";
        position: absolute;
        right: -12px;
        top: 8px;
        width: 22px;
        height: 11px;
        border-radius: 999px;
        background: var(--tool, #f4d45c);
        border: 3px solid #5b3723;
        transform: rotate(-28deg);
      }

      .start-pad {
        position: absolute;
        left: 50%;
        bottom: 96px;
        translate: -50% 0;
        width: min(84%, 390px);
        display: grid;
        gap: 9px;
        justify-items: center;
      }

      .recruit-note {
        justify-self: start;
        padding: 7px 12px;
        border-radius: 999px;
        color: #fff8dd;
        background: rgba(35, 39, 52, 0.86);
        border: 2px solid rgba(255,247,206,0.2);
        box-shadow: 0 4px 0 rgba(24, 27, 38, 0.28);
        font-size: 0.86rem;
        font-weight: 1000;
      }

      .start-button, .primary-button {
        width: 100%;
        min-height: 70px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        padding: 10px 18px;
        color: #3e2209;
        background: linear-gradient(#fff17d, #ffc53c 58%, #ef8a23);
        border: 4px solid #fff7ce;
        box-shadow: 0 9px 0 #9d5d20, 0 18px 30px rgba(90, 51, 14, 0.3);
        text-transform: uppercase;
        font-weight: 1000;
        font-size: clamp(1.28rem, 7vw, 2.25rem);
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(255,255,255,0.36);
      }

      .start-button:active, .primary-button:active, .round-action:active, .hotspot:active, .nav button:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 rgba(101, 57, 19, 0.24);
      }

      .primary-button {
        min-height: 54px;
        font-size: 1rem;
        border-radius: 16px;
      }

      .bottom-nav {
        position: fixed;
        z-index: 70;
        left: 50%;
        bottom: 0;
        translate: -50% 0;
        width: min(100vw, 520px);
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        background: rgba(31, 34, 48, 0.96);
        border-top: 2px solid rgba(255, 247, 206, 0.2);
        box-shadow: 0 -12px 32px rgba(34, 25, 20, 0.32);
      }

      .nav button {
        min-height: 64px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 3px;
        background: transparent;
        color: #d9e2ee;
        font-size: 0.7rem;
        font-weight: 1000;
      }

      .nav button::before {
        content: attr(data-icon);
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        color: #4b2a10;
        background: linear-gradient(#fff5a9, #f0a13b);
        box-shadow: 0 4px 0 rgba(0,0,0,0.22);
      }

      .nav button.active {
        color: #fff4b8;
        background: linear-gradient(180deg, rgba(255, 210, 88, 0.18), rgba(255, 180, 56, 0.08));
      }

      .sheet {
        position: absolute;
        inset: 104px 12px 88px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 15px;
        overflow: auto;
        border-radius: 25px;
        color: #34220f;
        background: var(--panel);
        border: 4px solid rgba(255, 251, 219, 0.86);
        box-shadow: var(--shadow), inset 0 0 0 2px rgba(122, 80, 29, 0.14);
      }

      .sheet-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
      }

      .sheet h1, .sheet h2, .sheet h3, .battle h1, .result-card h2 {
        margin: 0;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .sheet h1 {
        font-size: clamp(1.55rem, 9vw, 2.65rem);
      }

      .sheet p {
        margin: 0;
        color: var(--ink-soft);
        line-height: 1.35;
        font-weight: 700;
      }

      .close-button {
        width: 42px;
        height: 42px;
        border-radius: 15px;
        color: #5a3616;
        background: linear-gradient(#fff8bf, #f4b34a);
        border: 3px solid #fffbe1;
        box-shadow: 0 5px 0 rgba(120,70,18,0.28);
        font-weight: 1000;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card {
        border-radius: 19px;
        padding: 12px;
        background: rgba(255,255,255,0.66);
        border: 2px solid rgba(99, 65, 25, 0.17);
        box-shadow: 0 5px 0 rgba(118, 72, 20, 0.12);
      }

      .hero-card {
        min-height: 156px;
        display: grid;
        align-content: space-between;
        gap: 10px;
        overflow: hidden;
        position: relative;
      }

      .hero-card.locked {
        filter: saturate(0.6);
        opacity: 0.74;
      }

      .hero-mini {
        width: 64px;
        height: 76px;
        margin: 0 auto;
        position: relative;
      }

      .hero-mini .face {
        position: absolute;
        left: 17px;
        top: 2px;
        width: 31px;
        height: 30px;
        border-radius: 45% 45% 52% 52%;
        background: #ffd5a0;
        border: 3px solid #503018;
      }

      .hero-mini .robe {
        position: absolute;
        left: 9px;
        top: 28px;
        width: 48px;
        height: 45px;
        border-radius: 15px 15px 20px 20px;
        background: var(--c, #45a7dc);
        border: 3px solid #503018;
      }

      .hero-mini .tool {
        position: absolute;
        right: -1px;
        top: 33px;
        width: 22px;
        height: 12px;
        border-radius: 999px;
        background: var(--t, #f6d45d);
        border: 3px solid #503018;
        rotate: -28deg;
      }

      .hero-card h3 {
        font-size: 1.02rem;
      }

      .hero-card small, .stat-pill, .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 26px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(36, 39, 55, 0.9);
        color: #fff4cd;
        font-size: 0.72rem;
        font-weight: 1000;
      }

      .hero-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .summon-orb {
        min-height: 210px;
        border-radius: 25px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 18px;
        background:
          radial-gradient(circle at 50% 38%, rgba(255,255,255,0.94), rgba(255,230,119,0.9) 22%, rgba(255,148,63,0.65) 42%, transparent 43%),
          linear-gradient(160deg, rgba(122, 85, 196, 0.3), rgba(255, 200, 83, 0.74));
        border: 3px solid rgba(105, 70, 26, 0.25);
        box-shadow: inset 0 0 50px rgba(255,255,255,0.5), 0 8px 0 rgba(117, 70, 18, 0.16);
      }

      .summon-orb strong {
        font-size: 2.3rem;
        color: #4a2c13;
        text-shadow: 0 2px 0 rgba(255,255,255,0.45);
      }

      .formation-board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .slot {
        aspect-ratio: 1;
        min-height: 86px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        text-align: center;
        background: rgba(255,255,255,0.56);
        border: 3px dashed rgba(110, 73, 25, 0.35);
        color: #66471e;
        font-weight: 1000;
      }

      .slot.filled {
        border-style: solid;
        background: linear-gradient(160deg, #fff7cb, #ffc968);
      }

      .campaign-list {
        display: grid;
        gap: 10px;
      }

      .stage-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .stage-card button {
        min-width: 86px;
        min-height: 46px;
        border-radius: 14px;
        background: linear-gradient(#fff17d, #f29b2d);
        border: 3px solid #fff7ce;
        box-shadow: 0 5px 0 rgba(120,70,18,0.22);
        font-weight: 1000;
      }

      .battle {
        position: absolute;
        inset: 0;
        z-index: 100;
        color: #fff8da;
        background:
          linear-gradient(180deg, rgba(45, 107, 177, 0.46), rgba(214, 125, 34, 0.5)),
          url("/assets/heroi-ortodoxo-hub.png?v=20260710b") center / cover no-repeat;
        padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
      }

      .battle-top {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 9px;
        align-items: center;
      }

      .battle-title {
        min-width: 0;
        padding: 9px 12px;
        border-radius: 17px;
        background: rgba(34, 37, 51, 0.88);
        border: 2px solid rgba(255, 247, 206, 0.2);
        box-shadow: 0 5px 0 rgba(22, 24, 34, 0.28);
      }

      .battle-title h1 {
        font-size: 1.25rem;
      }

      .battle-title small {
        display: block;
        color: #ffe477;
        font-weight: 1000;
      }

      .arena {
        position: relative;
        min-height: 420px;
        border-radius: 28px;
        overflow: hidden;
        background:
          radial-gradient(ellipse at center, rgba(255, 229, 130, 0.44), rgba(112, 64, 23, 0.22) 62%, rgba(46, 35, 30, 0.42)),
          linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.08));
        border: 4px solid rgba(255, 247, 206, 0.48);
        box-shadow: inset 0 -18px 50px rgba(94, 55, 18, 0.18), 0 12px 35px rgba(54, 34, 18, 0.3);
      }

      .lane {
        position: absolute;
        left: 8%;
        right: 8%;
        height: 2px;
        background: rgba(255,255,255,0.12);
      }
      .lane.one { top: 36%; }
      .lane.two { top: 61%; }

      .fighter {
        position: absolute;
        width: 62px;
        min-height: 84px;
        display: grid;
        justify-items: center;
        align-content: end;
        gap: 3px;
        transition: left 0.24s ease, top 0.24s ease, transform 0.18s ease;
      }

      .fighter.hit { transform: translateY(-5px) scale(1.05); }

      .token {
        width: 58px;
        height: 58px;
        border-radius: 50% 50% 42% 42%;
        border: 4px solid #593820;
        box-shadow: 0 7px 0 rgba(53, 34, 18, 0.18);
        position: relative;
      }

      .token::before, .token::after {
        content: "";
        position: absolute;
        top: 20px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #21212f;
      }
      .token::before { left: 17px; }
      .token::after { right: 17px; }

      .fighter.hero .token {
        background: linear-gradient(145deg, var(--c, #43a6d9), #fff0a2);
      }

      .fighter.enemy .token {
        background: linear-gradient(145deg, #d96049, #7e4030);
      }

      .hp {
        width: 58px;
        height: 9px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(30, 24, 18, 0.5);
        border: 1px solid rgba(255,255,255,0.28);
      }

      .hp span {
        display: block;
        width: var(--hp, 100%);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #68e16c, #ffe65d);
      }

      .battle-log {
        min-height: 68px;
        padding: 10px 12px;
        border-radius: 17px;
        background: rgba(34, 37, 51, 0.9);
        border: 2px solid rgba(255, 247, 206, 0.2);
        color: #fff7dc;
        font-weight: 900;
      }

      .choices, .result-layer {
        position: absolute;
        inset: 0;
        z-index: 120;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(32, 28, 24, 0.42);
        backdrop-filter: blur(5px);
      }

      .choice-panel, .result-card {
        width: min(100%, 420px);
        display: grid;
        gap: 10px;
        padding: 15px;
        border-radius: 25px;
        background: var(--panel);
        color: #34220f;
        border: 4px solid rgba(255,251,219,0.88);
        box-shadow: var(--shadow);
      }

      .choice-card {
        min-height: 84px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
        text-align: left;
        border-radius: 19px;
        padding: 10px;
        background: linear-gradient(145deg, #fff8c8, #ffd679);
        border: 3px solid rgba(118, 77, 26, 0.18);
        box-shadow: 0 5px 0 rgba(118, 72, 20, 0.18);
      }

      .choice-icon {
        width: 50px;
        height: 50px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        color: #fff8d5;
        background: linear-gradient(145deg, #46a9df, #8f5ee0);
        font-weight: 1000;
      }

      .toast {
        position: fixed;
        z-index: 150;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom));
        translate: -50% 24px;
        width: min(92vw, 440px);
        border-radius: 19px;
        padding: 11px 14px;
        background: rgba(34, 37, 51, 0.94);
        color: #fff8db;
        border: 2px solid rgba(255, 247, 206, 0.24);
        box-shadow: 0 12px 30px rgba(28, 21, 15, 0.26);
        opacity: 0;
        pointer-events: none;
        transition: 0.24s ease;
        font-weight: 900;
      }
      .toast.show {
        opacity: 1;
        translate: -50% 0;
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @media (min-height: 820px) {
        .hotspot.summon { top: 248px; }
        .hotspot.heroes { top: 288px; }
        .hotspot.formation { top: 468px; }
        .hotspot.campaign { top: 450px; }
        .hotspot.checkin { top: 620px; }
        .party-yard { top: 622px; }
      }

      @media (max-width: 380px) {
        .resources { gap: 5px; }
        .resource { font-size: 0.68rem; }
        .hotspot { min-width: 78px; min-height: 60px; }
        .hotspot span { font-size: 0.72rem; }
        .sheet { inset-inline: 8px; }
        .grid { grid-template-columns: 1fr; }
      }

      @media (min-width: 760px) {
        body {
          background:
            linear-gradient(90deg, rgba(50, 33, 19, 0.28), transparent 28%, transparent 72%, rgba(50, 33, 19, 0.28)),
            url("/assets/heroi-ortodoxo-hub.png?v=20260710b") center / cover fixed no-repeat;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" id="app">
      <section class="stage" id="stage">
        <header class="top-hud">
          <div class="profile-strip">
            <div class="avatar" id="avatar" data-level="1" aria-hidden="true"></div>
            <div class="name-card">
              <strong id="player-name">Peregrino</strong>
              <div class="xp-track" aria-label="Progresso de nível"><span id="xp-bar"></span></div>
            </div>
            <button class="round-action" id="sound-btn" type="button" aria-label="Som">II</button>
          </div>
          <div class="resources" aria-label="Recursos">
            <div class="resource"><i class="energy"></i><span id="energy">60/60</span></div>
            <div class="resource"><i class="gem"></i><span id="gems">120</span></div>
            <div class="resource"><i class="coin"></i><span id="coins">1653</span></div>
            <div class="resource"><i class="scroll"></i><span id="tickets">1</span></div>
          </div>
        </header>

        <section class="home-view" id="home-view" aria-label="Acampamento">
          <div class="chapter-pin">
            <b id="chapter-kicker">Capítulo mais alto</b>
            <span id="chapter-name">Jardim e Ermo</span>
          </div>

          <button class="hotspot summon" type="button" data-view="summon" data-icon="S">
            <small id="summon-badge">1</small><span>Invocar</span>
          </button>
          <button class="hotspot heroes" type="button" data-view="heroes" data-icon="H">
            <span>Heróis</span>
          </button>
          <button class="hotspot formation" type="button" data-view="formation" data-icon="F">
            <span>Formação</span>
          </button>
          <button class="hotspot campaign" type="button" data-view="campaign" data-icon="C">
            <span>Campanha</span>
          </button>
          <button class="hotspot checkin" type="button" id="checkin-btn" data-icon="+">
            <small id="checkin-badge">!</small><span>Oferta</span>
          </button>

          <div class="party-yard" id="party-yard" aria-hidden="true"></div>

          <div class="start-pad">
            <div class="recruit-note" id="quest-note">Recrutar heróis: <span>0/3</span></div>
            <button class="start-button" id="start-button" type="button">Começar</button>
          </div>
        </section>

        <section class="sheet hidden" id="sheet" aria-live="polite"></section>
      </section>

      <nav class="bottom-nav nav" aria-label="Menu principal">
        <button type="button" class="active" data-view="home" data-icon="A">Acamp.</button>
        <button type="button" data-view="summon" data-icon="S">Invocar</button>
        <button type="button" data-view="heroes" data-icon="H">Heróis</button>
        <button type="button" data-view="formation" data-icon="F">Equipe</button>
        <button type="button" data-view="campaign" data-icon="C">Fases</button>
      </nav>

      <section class="battle hidden" id="battle" aria-live="polite">
        <div class="battle-top">
          <button class="round-action" type="button" id="battle-exit" aria-label="Sair">X</button>
          <div class="battle-title">
            <small id="battle-wave">Onda 1</small>
            <h1 id="battle-title">Jardim e Ermo</h1>
          </div>
          <div class="resource"><i class="energy"></i><span id="battle-energy">60</span></div>
        </div>
        <div class="arena" id="arena">
          <i class="lane one"></i>
          <i class="lane two"></i>
        </div>
        <div class="battle-log" id="battle-log">Prepare a equipe para a primeira arena.</div>
        <div class="choices hidden" id="choices"></div>
        <div class="result-layer hidden" id="result"></div>
      </section>

      <div class="toast" id="toast"></div>
    </main>

    <script>
      (() => {
        const saveKey = "heroi-ortodoxo-save-v3";
        const heroes = [
          { id: "davi", name: "Davi", role: "Harpa e funda", color: "#4aa5db", tool: "#f2d35a", hp: 95, atk: 13, spd: 1.12, rarity: "Inicial" },
          { id: "debora", name: "Débora", role: "Juízo e coragem", color: "#9b65d8", tool: "#ffdf69", hp: 80, atk: 16, spd: 1.18, rarity: "Rara" },
          { id: "gideao", name: "Gideão", role: "Escudo e trombeta", color: "#e0684b", tool: "#f8c44b", hp: 118, atk: 11, spd: 0.95, rarity: "Raro" },
          { id: "ester", name: "Ester", role: "Graça e proteção", color: "#ef6fb2", tool: "#69cbe9", hp: 86, atk: 12, spd: 1.25, rarity: "Especial" },
          { id: "moises", name: "Moisés", role: "Cajado e sinais", color: "#68b667", tool: "#d7aa65", hp: 104, atk: 15, spd: 0.98, rarity: "Especial" },
          { id: "josue", name: "Josué", role: "Frente de batalha", color: "#3f74d8", tool: "#e8c56d", hp: 110, atk: 15, spd: 1.02, rarity: "Raro" }
        ];

        const stages = [
          { id: 1, name: "Jardim e Ermo", tip: "Primeira arena: alcance, integridade e leitura de alvo.", cost: 8, enemies: 2 },
          { id: 2, name: "Areia Vermelha", tip: "Inimigos se aproximam mais rápido.", cost: 12, enemies: 5 },
          { id: 3, name: "Porta do Vale", tip: "Defenda a formação contra duas ondas.", cost: 14, enemies: 6 }
        ];

        const upgrades = [
          { id: "fervor", title: "Fervor", text: "+18% de ataque nesta fase.", apply: s => s.bonusAtk += 0.18 },
          { id: "vigilia", title: "Vigília", text: "+24 de vida para todos.", apply: s => s.bonusHp += 24 },
          { id: "disciplina", title: "Disciplina", text: "Ataques ficam mais rápidos.", apply: s => s.bonusSpeed += 0.16 },
          { id: "provisao", title: "Provisão", text: "Ganhe 45 moedas agora.", apply: s => { state.coins += 45; } },
          { id: "salmo", title: "Salmo", text: "Cura parcial da equipe.", apply: s => { s.party.forEach(unit => unit.hp = Math.min(unit.maxHp, unit.hp + 28)); } }
        ];

        const state = load();
        const els = {
          app: document.getElementById("app"),
          avatar: document.getElementById("avatar"),
          xpBar: document.getElementById("xp-bar"),
          player: document.getElementById("player-name"),
          energy: document.getElementById("energy"),
          gems: document.getElementById("gems"),
          coins: document.getElementById("coins"),
          tickets: document.getElementById("tickets"),
          note: document.getElementById("quest-note"),
          party: document.getElementById("party-yard"),
          sheet: document.getElementById("sheet"),
          toast: document.getElementById("toast"),
          nav: Array.from(document.querySelectorAll(".nav button")),
          battle: document.getElementById("battle"),
          arena: document.getElementById("arena"),
          battleLog: document.getElementById("battle-log"),
          choices: document.getElementById("choices"),
          result: document.getElementById("result"),
          battleWave: document.getElementById("battle-wave"),
          battleTitle: document.getElementById("battle-title"),
          battleEnergy: document.getElementById("battle-energy"),
          summonBadge: document.getElementById("summon-badge"),
          checkinBadge: document.getElementById("checkin-badge")
        };

        let battle = null;
        let timer = null;

        document.querySelectorAll("[data-view]").forEach(button => {
          button.addEventListener("click", () => openView(button.dataset.view));
        });
        document.getElementById("start-button").addEventListener("click", () => {
          if (!state.owned.length) {
            toast("Faça a primeira invocação grátis para liberar a equipe.");
            openView("summon");
            return;
          }
          startBattle(state.stage);
        });
        document.getElementById("battle-exit").addEventListener("click", endBattle);
        document.getElementById("checkin-btn").addEventListener("click", dailyGift);
        document.getElementById("sound-btn").addEventListener("click", () => {
          state.sound = !state.sound;
          save();
          render();
          toast(state.sound ? "Som marcado como ligado." : "Som marcado como pausado.");
        });

        render();
        if (!state.seenIntro) {
          state.seenIntro = true;
          save();
          setTimeout(() => openView("summon"), 650);
        }

        function defaultState() {
          return {
            name: "Peregrino",
            level: 1,
            xp: 0,
            energy: 60,
            gems: 120,
            coins: 1653,
            tickets: 1,
            stage: 1,
            owned: [],
            formation: [],
            summons: 0,
            lastGift: "",
            sound: true,
            seenIntro: false
          };
        }

        function load() {
          try {
            return { ...defaultState(), ...JSON.parse(localStorage.getItem(saveKey) || "{}") };
          } catch {
            return defaultState();
          }
        }

        function save() {
          localStorage.setItem(saveKey, JSON.stringify(state));
        }

        function render() {
          const levelProgress = Math.min(100, (state.xp % 100));
          els.avatar.dataset.level = state.level;
          els.player.textContent = state.name;
          els.xpBar.style.width = `${levelProgress}%`;
          els.energy.textContent = `${state.energy}/60`;
          els.gems.textContent = state.gems;
          els.coins.textContent = state.coins;
          els.tickets.textContent = state.tickets;
          els.battleEnergy.textContent = state.energy;
          els.note.innerHTML = `Recrutar heróis: <span>${state.owned.length}/3</span>`;
          els.summonBadge.classList.toggle("hidden", state.tickets < 1);
          els.checkinBadge.classList.toggle("hidden", canGift() === false);
          document.getElementById("sound-btn").textContent = state.sound ? "II" : "M";
          renderParty();
        }

        function renderParty() {
          const ids = currentFormation();
          els.party.innerHTML = ids.map((id, index) => {
            const hero = heroById(id);
            const left = [16, 43, 70][index] || 43;
            return `<div class="chibi" style="left:${left}%;top:${index === 1 ? 0 : 22}px;--robe:${hero.color};--tool:${hero.tool}">
              <i class="head"></i><i class="body"></i>
            </div>`;
          }).join("");
        }

        function currentFormation() {
          const fallback = state.owned.slice(0, 3);
          const picked = state.formation.filter(id => state.owned.includes(id));
          const merged = [...picked, ...fallback.filter(id => !picked.includes(id))];
          return merged.slice(0, 3);
        }

        function heroById(id) {
          return heroes.find(hero => hero.id === id) || heroes[0];
        }

        function openView(view) {
          if (view === "home") {
            els.sheet.classList.add("hidden");
          } else if (view === "summon") {
            renderSummon();
          } else if (view === "heroes") {
            renderHeroes();
          } else if (view === "formation") {
            renderFormation();
          } else if (view === "campaign") {
            renderCampaign();
          }
          els.nav.forEach(button => button.classList.toggle("active", button.dataset.view === view || (view === "home" && button.dataset.view === "home")));
        }

        function sheet(title, body) {
          els.sheet.innerHTML = `<div class="sheet-head"><div><h1>${title}</h1></div><button class="close-button" type="button" aria-label="Fechar">X</button></div>${body}`;
          els.sheet.querySelector(".close-button").addEventListener("click", () => openView("home"));
          els.sheet.classList.remove("hidden");
        }

        function renderSummon() {
          sheet("Invocação", `
            <p>Use pergaminhos para chamar aliados bíblicos e fortalecer a equipe antes das arenas.</p>
            <div class="summon-orb"><strong>${state.tickets > 0 ? "1 livre" : "120 gemas"}</strong><span class="tag">chance de herói raro</span></div>
            <button class="primary-button" id="summon-now" type="button">${state.tickets > 0 ? "Invocar grátis" : "Invocar herói"}</button>
            <div class="card"><b>Convite inicial</b><p>A primeira invocação sempre libera um aliado para a formação.</p></div>
          `);
          document.getElementById("summon-now").addEventListener("click", summonHero);
        }

        function summonHero() {
          if (state.tickets <= 0 && state.gems < 120) {
            toast("Faltam gemas para invocar.");
            return;
          }
          if (state.tickets > 0) state.tickets -= 1;
          else state.gems -= 120;
          const pool = heroes.filter(hero => !state.owned.includes(hero.id));
          const next = state.summons === 0 && !state.owned.includes("davi")
            ? heroById("davi")
            : (pool.length ? pool[(state.summons + state.stage) % pool.length] : heroes[(state.summons + 2) % heroes.length]);
          if (!state.owned.includes(next.id)) state.owned.push(next.id);
          if (!state.formation.includes(next.id) && state.formation.length < 3) state.formation.push(next.id);
          state.summons += 1;
          state.xp += 20;
          levelCheck();
          save();
          render();
          sheet("Aliado chamado", `
            <div class="card hero-card" style="--c:${next.color};--t:${next.tool}">
              <div class="hero-mini"><i class="face"></i><i class="robe"></i><i class="tool"></i></div>
              <div><h3>${next.name}</h3><p>${next.role}</p></div>
              <span class="stat-pill">${next.rarity}</span>
            </div>
            <button class="primary-button" id="go-formation" type="button">Ver formação</button>
          `);
          document.getElementById("go-formation").addEventListener("click", renderFormation);
        }

        function renderHeroes() {
          const cards = heroes.map(hero => {
            const owned = state.owned.includes(hero.id);
            return `<article class="card hero-card ${owned ? "" : "locked"}" style="--c:${hero.color};--t:${hero.tool}">
              <div class="hero-mini"><i class="face"></i><i class="robe"></i><i class="tool"></i></div>
              <div class="hero-line"><h3>${hero.name}</h3><small>${owned ? "Obtido" : "Bloqueado"}</small></div>
              <p>${hero.role}</p>
              <span class="stat-pill">ATQ ${hero.atk} / VIDA ${hero.hp}</span>
            </article>`;
          }).join("");
          sheet("Heróis", `<p>Colecione aliados e escolha até três para entrar na campanha.</p><div class="grid">${cards}</div>`);
        }

        function renderFormation() {
          const slots = [0, 1, 2].map(index => {
            const id = currentFormation()[index];
            if (!id) return `<button class="slot" type="button" data-add="${index}">Vazio</button>`;
            const hero = heroById(id);
            return `<button class="slot filled" type="button" data-remove="${hero.id}"><div class="hero-mini" style="--c:${hero.color};--t:${hero.tool}"><i class="face"></i><i class="robe"></i><i class="tool"></i></div><span>${hero.name}</span></button>`;
          }).join("");
          const bench = state.owned.map(id => {
            const hero = heroById(id);
            return `<button class="card" type="button" data-pick="${hero.id}"><b>${hero.name}</b><p>${hero.role}</p></button>`;
          }).join("") || `<div class="card"><b>Nenhum herói ainda</b><p>Faça uma invocação para montar a equipe.</p></div>`;
          sheet("Formação", `
            <p>Toque em um herói da reserva para colocá-lo na equipe. Toque no slot para remover.</p>
            <div class="formation-board">${slots}</div>
            <h2>Reserva</h2>
            <div class="grid">${bench}</div>
          `);
          els.sheet.querySelectorAll("[data-remove]").forEach(button => {
            button.addEventListener("click", () => {
              state.formation = state.formation.filter(id => id !== button.dataset.remove);
              save();
              render();
              renderFormation();
            });
          });
          els.sheet.querySelectorAll("[data-pick]").forEach(button => {
            button.addEventListener("click", () => {
              const id = button.dataset.pick;
              state.formation = state.formation.filter(item => item !== id);
              state.formation.unshift(id);
              state.formation = state.formation.slice(0, 3);
              save();
              render();
              renderFormation();
            });
          });
        }

        function renderCampaign() {
          const list = stages.map(stage => {
            const locked = stage.id > state.stage + 1;
            const label = locked ? "Bloq." : (stage.id <= state.stage ? "Jogar" : "Novo");
            return `<article class="card stage-card">
              <div><span class="tag">Capítulo ${stage.id}</span><h3>${stage.name}</h3><p>${stage.tip}</p></div>
              <button type="button" data-stage="${stage.id}" ${locked ? "disabled" : ""}>${label}</button>
            </article>`;
          }).join("");
          sheet("Campanha", `<p>Avance por arenas curtas, escolha bênçãos de combate e receba recompensas.</p><div class="campaign-list">${list}</div>`);
          els.sheet.querySelectorAll("[data-stage]").forEach(button => {
            button.addEventListener("click", () => startBattle(Number(button.dataset.stage)));
          });
        }

        function startBattle(stageId) {
          const stage = stages.find(item => item.id === stageId) || stages[0];
          if (!state.owned.length) {
            toast("Invoque pelo menos um herói antes da arena.");
            openView("summon");
            return;
          }
          if (state.energy < stage.cost) {
            toast("Energia insuficiente. Pegue a oferta diária.");
            return;
          }
          state.energy -= stage.cost;
          battle = {
            stage,
            time: 0,
            wave: 1,
            bonusAtk: 0,
            bonusHp: 0,
            bonusSpeed: 0,
            paused: false,
            party: currentFormation().map((id, index) => makeHero(heroById(id), index)),
            enemies: makeEnemies(stage, 1)
          };
          els.sheet.classList.add("hidden");
          els.battle.classList.remove("hidden");
          els.result.classList.add("hidden");
          els.choices.classList.add("hidden");
          els.battleTitle.textContent = stage.name;
          save();
          render();
          drawBattle();
          log("A arena começou. Seus heróis atacam automaticamente.");
          clearInterval(timer);
          timer = setInterval(tick, 500);
        }

        function makeHero(hero, index) {
          const hp = hero.hp + (state.level - 1) * 8;
          return {
            side: "hero",
            id: hero.id,
            name: hero.name,
            color: hero.color,
            maxHp: hp,
            hp,
            atk: hero.atk + Math.floor(state.level / 2),
            spd: hero.spd,
            x: 18,
            y: [31, 51, 70][index] || 51,
            cd: 0
          };
        }

        function makeEnemies(stage, wave) {
          return Array.from({ length: Math.min(3, stage.enemies - (wave - 1) * 2) }, (_, index) => ({
            side: "enemy",
            id: `enemy-${wave}-${index}`,
            name: ["Sombra", "Saqueador", "Fera"][index % 3],
            maxHp: 34 + stage.id * 8 + wave * 6,
            hp: 34 + stage.id * 8 + wave * 6,
            atk: 5 + stage.id * 2 + wave,
            spd: 0.92 + stage.id * 0.04,
            x: 74 + index * 5,
            y: [32, 51, 69][index] || 51,
            cd: index
          }));
        }

        function tick() {
          if (!battle || battle.paused) return;
          battle.time += 0.5;
          [...battle.party, ...battle.enemies].forEach(unit => {
            if (unit.hp <= 0) return;
            unit.cd -= (unit.spd + battle.bonusSpeed) * 0.5;
            if (unit.cd <= 0) {
              attack(unit);
              unit.cd = 1.2;
            }
          });
          battle.enemies = battle.enemies.filter(unit => unit.hp > 0);
          battle.party = battle.party.filter(unit => unit.hp > 0);
          drawBattle();

          if (!battle.party.length) {
            finish(false);
            return;
          }
          if (!battle.enemies.length) {
            if (battle.wave < 2 && battle.stage.id > 1) {
              showChoices();
            } else {
              finish(true);
            }
          }
        }

        function attack(unit) {
          const targets = unit.side === "hero" ? battle.enemies : battle.party;
          const target = targets[0];
          if (!target) return;
          const damage = Math.max(3, Math.round(unit.atk * (unit.side === "hero" ? 1 + battle.bonusAtk : 1)));
          target.hp -= damage;
          log(`${unit.name} causou ${damage} de dano.`);
        }

        function drawBattle() {
          if (!battle) return;
          els.battleWave.textContent = `Onda ${battle.wave}`;
          const units = [...battle.party, ...battle.enemies].map(unit => {
            const hp = Math.max(0, Math.round((unit.hp / unit.maxHp) * 100));
            return `<div class="fighter ${unit.side}" style="left:${unit.x}%;top:${unit.y}%;--c:${unit.color || "#d85e49"}">
              <i class="token"></i><div class="hp" style="--hp:${hp}%"><span></span></div>
            </div>`;
          }).join("");
          els.arena.querySelectorAll(".fighter").forEach(node => node.remove());
          els.arena.insertAdjacentHTML("beforeend", units);
        }

        function showChoices() {
          battle.paused = true;
          const options = upgrades.slice().sort(() => Math.random() - 0.5).slice(0, 3);
          els.choices.innerHTML = `<div class="choice-panel"><h2>Escolha uma bênção</h2>${options.map(item => `
            <button type="button" class="choice-card" data-upgrade="${item.id}">
              <span class="choice-icon">${item.title.slice(0, 1)}</span>
              <span><b>${item.title}</b><p>${item.text}</p></span>
            </button>`).join("")}</div>`;
          els.choices.classList.remove("hidden");
          els.choices.querySelectorAll("[data-upgrade]").forEach(button => {
            button.addEventListener("click", () => {
              const chosen = upgrades.find(item => item.id === button.dataset.upgrade);
              chosen.apply(battle);
              battle.wave += 1;
              battle.enemies = makeEnemies(battle.stage, battle.wave);
              battle.paused = false;
              els.choices.classList.add("hidden");
              log(`${chosen.title} aplicada. Próxima onda!`);
              save();
              render();
              drawBattle();
            });
          });
        }

        function finish(win) {
          clearInterval(timer);
          timer = null;
          if (win) {
            const reward = 90 + battle.stage.id * 35;
            state.coins += reward;
            state.gems += 12 + battle.stage.id * 3;
            state.xp += 45 + battle.stage.id * 12;
            state.stage = Math.max(state.stage, Math.min(stages.length, battle.stage.id + 1));
            levelCheck();
            save();
            render();
            els.result.innerHTML = `<article class="result-card"><h2>Vitória!</h2><p>Você recebeu ${reward} moedas, gemas e experiência.</p><button class="primary-button" id="result-close" type="button">Voltar ao acampamento</button></article>`;
          } else {
            state.energy = Math.min(60, state.energy + 3);
            save();
            render();
            els.result.innerHTML = `<article class="result-card"><h2>Derrota</h2><p>Melhore a formação, invoque mais aliados e tente de novo.</p><button class="primary-button" id="result-close" type="button">Voltar ao acampamento</button></article>`;
          }
          els.result.classList.remove("hidden");
          document.getElementById("result-close").addEventListener("click", endBattle);
        }

        function endBattle() {
          clearInterval(timer);
          timer = null;
          battle = null;
          els.battle.classList.add("hidden");
          els.result.classList.add("hidden");
          els.choices.classList.add("hidden");
          openView("home");
          render();
        }

        function log(text) {
          els.battleLog.textContent = text;
        }

        function dailyGift() {
          if (!canGift()) {
            toast("A oferta diária já foi coletada.");
            return;
          }
          state.lastGift = today();
          state.energy = 60;
          state.tickets += 1;
          state.coins += 120;
          save();
          render();
          toast("Oferta coletada: energia cheia, pergaminho e moedas.");
        }

        function canGift() {
          return state.lastGift !== today();
        }

        function today() {
          return new Date().toISOString().slice(0, 10);
        }

        function levelCheck() {
          while (state.xp >= state.level * 100) {
            state.level += 1;
            state.energy = 60;
          }
        }

        function toast(text) {
          els.toast.textContent = text;
          els.toast.classList.add("show");
          window.clearTimeout(els.toast._timer);
          els.toast._timer = window.setTimeout(() => els.toast.classList.remove("show"), 2200);
        }
      })();
    </script>
  </body>
</html>
