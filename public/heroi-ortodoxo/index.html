<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Herói Ortodoxo | Ortodoxia Luterana Gaming</title>
    <style>
      :root {
        --sky: #77c9f4;
        --sand: #f4c968;
        --sand-dark: #c98a32;
        --ink: #1e2432;
        --ink-soft: #41495d;
        --cream: #fff7da;
        --paper: #ffe9a6;
        --gold: #ffc645;
        --gold-2: #f1922e;
        --red: #e9574c;
        --green: #54b95f;
        --blue: #32a2de;
        --violet: #8c62d9;
        --panel: rgba(255, 247, 218, 0.94);
        --panel-dark: rgba(35, 37, 50, 0.92);
        --line: rgba(93, 62, 25, 0.22);
        --shadow: 0 18px 45px rgba(76, 45, 12, 0.28);
        --soft-shadow: 0 9px 0 rgba(101, 57, 19, 0.24);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 6%, rgba(255, 255, 255, 0.86), transparent 18rem),
          linear-gradient(180deg, #8bd9ff 0%, #ffe4a0 58%, #c97931 100%);
        overflow-x: hidden;
        touch-action: manipulation;
      }

      button, a { font: inherit; }
      button {
        border: 0;
        cursor: pointer;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      .hidden { display: none !important; }

      .shell {
        width: min(100vw, 520px);
        min-height: 100svh;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
        background: #f5c263;
        box-shadow: 0 0 0 1px rgba(72, 41, 15, 0.18), 0 28px 90px rgba(54, 34, 18, 0.35);
      }

      .stage {
        min-height: 100svh;
        position: relative;
        isolation: isolate;
        padding: max(10px, env(safe-area-inset-top)) 10px calc(86px + env(safe-area-inset-bottom));
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,196,76,0.08) 48%, rgba(74,34,15,0.22)),
          url("/assets/heroi-ortodoxo-hub.png?v=20260710b") center top / cover no-repeat;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 245, 183, 0.08), transparent 34%),
          radial-gradient(circle at 50% 52%, transparent 0 13rem, rgba(92, 44, 12, 0.18) 31rem);
      }

      .top-hud {
        display: grid;
        gap: 8px;
        position: relative;
        z-index: 20;
      }

      .profile-strip {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 44% 36%, #fff8ca 0 16%, transparent 17%),
          radial-gradient(circle at 37% 41%, #27314a 0 4%, transparent 5%),
          radial-gradient(circle at 61% 41%, #27314a 0 4%, transparent 5%),
          linear-gradient(145deg, #65cf77, #25a6d1);
        border: 4px solid #fff7ce;
        box-shadow: 0 4px 0 rgba(54, 36, 21, 0.24), 0 0 0 2px rgba(69, 47, 26, 0.18);
        position: relative;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: 50%;
      }

      .avatar::after {
        content: attr(data-level);
        position: absolute;
        right: -7px;
        bottom: -6px;
        min-width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: linear-gradient(#ffe474, #f5962f);
        border: 2px solid #fff7ce;
        font-weight: 1000;
        font-size: 0.78rem;
        color: #55300e;
      }

      .name-card {
        min-width: 0;
        border-radius: 16px;
        padding: 7px 11px;
        background: rgba(32, 37, 52, 0.88);
        color: #fff8d5;
        box-shadow: 0 5px 0 rgba(24, 27, 38, 0.32);
        border: 2px solid rgba(255, 247, 206, 0.2);
      }

      .name-card strong {
        display: block;
        font-size: 1rem;
        line-height: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .xp-track {
        height: 10px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.22);
        overflow: hidden;
      }

      .xp-track span {
        display: block;
        height: 100%;
        width: var(--xp, 24%);
        border-radius: inherit;
        background: linear-gradient(90deg, #79e26d, #ffe16f);
      }

      .round-action {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        font-weight: 1000;
        background: linear-gradient(#fff1a9, #ffc045);
        border: 3px solid #fff7ce;
        box-shadow: var(--soft-shadow);
        color: #56320e;
      }

      .resources {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .resource {
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 7px;
        border-radius: 15px;
        padding: 4px 9px 4px 6px;
        background: rgba(32, 37, 52, 0.9);
        color: #fff7dd;
        font-size: 0.73rem;
        font-weight: 1000;
        box-shadow: 0 4px 0 rgba(24, 27, 38, 0.28);
        border: 2px solid rgba(255, 247, 206, 0.16);
      }

      .resource img {
        width: 34px;
        height: 34px;
        object-fit: contain;
        flex: 0 0 auto;
        filter: drop-shadow(0 2px 0 rgba(0,0,0,0.22));
      }

      .resource span {
        display: grid;
        min-width: 0;
        line-height: 1.04;
      }

      .resource b {
        color: #ffd86d;
        font-size: 0.64rem;
        text-transform: uppercase;
      }

      .resource strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .home-view {
        min-height: calc(100svh - 166px);
        position: relative;
        z-index: 4;
      }

      .chapter-pin {
        position: absolute;
        top: 198px;
        left: 50%;
        translate: -50% 0;
        width: min(72%, 330px);
        border-radius: 16px;
        padding: 7px 12px 9px;
        background: rgba(42, 44, 58, 0.9);
        color: #fff8db;
        text-align: center;
        box-shadow: 0 7px 0 rgba(22, 24, 34, 0.3);
        border: 2px solid rgba(255, 247, 206, 0.22);
      }

      .chapter-pin b {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #ffe67c;
      }

      .chapter-pin span {
        display: block;
        margin-top: 2px;
        font-size: 1rem;
        font-weight: 1000;
      }

      .hotspot {
        position: relative;
        min-width: 0;
        min-height: 58px;
        border-radius: 16px;
        padding: 7px 6px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 4px;
        color: #fff9dd;
        text-shadow: 0 2px 0 rgba(65, 36, 18, 0.45);
        background: rgba(51, 44, 40, 0.48);
        border: 2px solid rgba(255, 251, 218, 0.56);
        box-shadow: 0 8px 18px rgba(64, 40, 17, 0.2);
        backdrop-filter: blur(2px);
      }

      .hotspot::before {
        content: attr(data-icon);
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        color: #4f2d10;
        background: linear-gradient(#fff3a4, #f49b2e);
        border: 2px solid rgba(255,255,255,0.8);
        box-shadow: 0 4px 0 rgba(69, 39, 16, 0.24);
        font-weight: 1000;
      }

      .hotspot span {
        font-size: 0.72rem;
        line-height: 1;
        font-weight: 1000;
      }

      .hotspot small {
        position: absolute;
        top: -9px;
        right: -8px;
        min-width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #ff4264;
        color: white;
        border: 2px solid #fff1bf;
        font-size: 0.72rem;
        font-weight: 1000;
      }

      .party-yard {
        position: absolute;
        left: 50%;
        top: clamp(225px, 32svh, 300px);
        translate: -50% 0;
        width: min(82%, 390px);
        height: 110px;
      }

      .chibi {
        position: absolute;
        width: 74px;
        height: 92px;
        animation: bob 2.5s ease-in-out infinite;
        filter: drop-shadow(0 7px 0 rgba(72, 40, 16, 0.16));
      }

      .chibi img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        pointer-events: none;
      }

      .chibi:nth-child(2) { animation-delay: -0.8s; }
      .chibi:nth-child(3) { animation-delay: -1.5s; }

      .chibi .head {
        position: absolute;
        top: 0;
        left: 11px;
        width: 36px;
        height: 34px;
        border-radius: 46% 46% 50% 50%;
        background: #ffd49b;
        border: 3px solid #5b3723;
      }

      .chibi .head::before,
      .chibi .head::after {
        content: "";
        position: absolute;
        top: 13px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #272437;
      }
      .chibi .head::before { left: 8px; }
      .chibi .head::after { right: 8px; }

      .chibi .body {
        position: absolute;
        top: 29px;
        left: 7px;
        width: 45px;
        height: 44px;
        border-radius: 15px 15px 19px 19px;
        background: var(--robe, #49a6dd);
        border: 3px solid #5b3723;
      }

      .chibi .body::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 10px;
        width: 17px;
        height: 10px;
        border-radius: 999px;
        background: #ffd49b;
        border: 3px solid #5b3723;
      }

      .chibi .body::after {
        content: "";
        position: absolute;
        right: -12px;
        top: 8px;
        width: 22px;
        height: 11px;
        border-radius: 999px;
        background: var(--tool, #f4d45c);
        border: 3px solid #5b3723;
        transform: rotate(-28deg);
      }

      .start-pad {
        position: absolute;
        left: 50%;
        bottom: calc(86px + env(safe-area-inset-bottom));
        translate: -50% 0;
        width: min(78%, 360px);
        display: grid;
        gap: 9px;
        justify-items: center;
        z-index: 10;
      }

      .level-dock {
        width: 100%;
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr) 46px;
        gap: 8px;
        align-items: center;
      }

      .level-chip {
        min-height: 54px;
        border-radius: 17px;
        padding: 8px 12px;
        color: #fff8dd;
        background: rgba(35, 39, 52, 0.88);
        border: 2px solid rgba(255,247,206,0.22);
        box-shadow: 0 5px 0 rgba(24, 27, 38, 0.28);
        text-align: center;
        font-weight: 1000;
      }

      .level-chip b {
        display: block;
        color: #ffe67c;
        font-size: 0.76rem;
        text-transform: uppercase;
      }

      .level-chip span {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage-arrow {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        color: #56320e;
        background: linear-gradient(#fff1a9, #ffc045);
        border: 3px solid #fff7ce;
        box-shadow: 0 5px 0 rgba(101, 57, 19, 0.24);
        font-size: 1.25rem;
        font-weight: 1000;
      }

      .stage-arrow:disabled {
        opacity: 0.45;
        filter: grayscale(0.45);
      }

      .daily-gift {
        position: absolute;
        top: 268px;
        right: 14px;
        z-index: 8;
        min-width: 108px;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 15px;
        padding: 5px 10px 5px 6px;
        color: #fff8db;
        background: rgba(32, 37, 52, 0.9);
        border: 2px solid rgba(255, 247, 206, 0.22);
        box-shadow: 0 5px 0 rgba(24, 27, 38, 0.28);
        font-weight: 1000;
      }

      .daily-gift img {
        width: 36px;
        height: 36px;
        object-fit: contain;
      }

      .daily-gift small {
        position: absolute;
        top: -8px;
        right: -7px;
        min-width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #ff4264;
        color: white;
        border: 2px solid #fff1bf;
        font-size: 0.72rem;
      }

      .start-button, .primary-button {
        width: 100%;
        min-height: 58px;
        border-radius: 19px;
        display: grid;
        place-items: center;
        padding: 10px 18px;
        color: #3e2209;
        background: linear-gradient(#fff17d, #ffc53c 58%, #ef8a23);
        border: 4px solid #fff7ce;
        box-shadow: 0 9px 0 #9d5d20, 0 18px 30px rgba(90, 51, 14, 0.3);
        text-transform: uppercase;
        font-weight: 1000;
        font-size: clamp(1.15rem, 5.7vw, 1.8rem);
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(255,255,255,0.36);
      }

      .start-button:active, .primary-button:active, .round-action:active, .stage-arrow:active, .hotspot:active, .nav button:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 rgba(101, 57, 19, 0.24);
      }

      .primary-button {
        min-height: 54px;
        font-size: 1rem;
        border-radius: 16px;
      }

      .bottom-nav {
        position: fixed;
        z-index: 70;
        left: 50%;
        bottom: 0;
        translate: -50% 0;
        width: min(100vw, 520px);
        padding: 7px 8px max(7px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        background: rgba(31, 34, 48, 0.96);
        border-top: 2px solid rgba(255, 247, 206, 0.2);
        box-shadow: 0 -12px 32px rgba(34, 25, 20, 0.32);
      }

      .nav button {
        min-height: 58px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 3px;
        background: transparent;
        color: #d9e2ee;
        font-size: 0.7rem;
        font-weight: 1000;
      }

      .nav button img {
        width: 34px;
        height: 34px;
        object-fit: contain;
        filter: drop-shadow(0 4px 0 rgba(0,0,0,0.18));
      }

      .shell.battle-active .bottom-nav {
        display: none;
      }

      .nav button.active {
        color: #fff4b8;
        background: linear-gradient(180deg, rgba(255, 210, 88, 0.18), rgba(255, 180, 56, 0.08));
      }

      .sheet {
        position: absolute;
        inset: 104px 12px 88px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 15px;
        overflow: auto;
        border-radius: 25px;
        color: #34220f;
        background: var(--panel);
        border: 4px solid rgba(255, 251, 219, 0.86);
        box-shadow: var(--shadow), inset 0 0 0 2px rgba(122, 80, 29, 0.14);
      }

      .sheet-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
      }

      .sheet h1, .sheet h2, .sheet h3, .battle h1, .result-card h2 {
        margin: 0;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .sheet h1 {
        font-size: clamp(1.55rem, 9vw, 2.65rem);
      }

      .sheet p {
        margin: 0;
        color: var(--ink-soft);
        line-height: 1.35;
        font-weight: 700;
      }

      .close-button {
        width: 42px;
        height: 42px;
        border-radius: 15px;
        color: #5a3616;
        background: linear-gradient(#fff8bf, #f4b34a);
        border: 3px solid #fffbe1;
        box-shadow: 0 5px 0 rgba(120,70,18,0.28);
        font-weight: 1000;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card {
        border-radius: 19px;
        padding: 12px;
        background: rgba(255,255,255,0.66);
        border: 2px solid rgba(99, 65, 25, 0.17);
        box-shadow: 0 5px 0 rgba(118, 72, 20, 0.12);
      }

      .hero-card {
        min-height: 156px;
        display: grid;
        align-content: space-between;
        gap: 10px;
        overflow: hidden;
        position: relative;
      }

      .hero-card:disabled {
        cursor: default;
      }

      .hero-card.locked {
        filter: saturate(0.6);
        opacity: 0.74;
      }

      .hero-mini {
        width: 72px;
        height: 86px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }

      .hero-mini > img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        object-position: center bottom;
      }

      .hero-mini .face {
        position: absolute;
        left: 17px;
        top: 2px;
        width: 31px;
        height: 30px;
        border-radius: 45% 45% 52% 52%;
        background: #ffd5a0;
        border: 3px solid #503018;
      }

      .hero-mini .robe {
        position: absolute;
        left: 9px;
        top: 28px;
        width: 48px;
        height: 45px;
        border-radius: 15px 15px 20px 20px;
        background: var(--c, #45a7dc);
        border: 3px solid #503018;
      }

      .hero-mini .tool {
        position: absolute;
        right: -1px;
        top: 33px;
        width: 22px;
        height: 12px;
        border-radius: 999px;
        background: var(--t, #f6d45d);
        border: 3px solid #503018;
        rotate: -28deg;
      }

      .hero-card h3 {
        font-size: 1.02rem;
      }

      .hero-card small, .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 26px;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(36, 39, 55, 0.9);
        color: #fff4cd;
        font-size: 0.72rem;
        font-weight: 1000;
      }

      .hero-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .roster-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }

      .roster-card {
        min-height: 144px;
        border-radius: 17px;
        padding: 8px 6px;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 5px;
        background: rgba(255,255,255,0.66);
        border: 2px solid rgba(99, 65, 25, 0.17);
        box-shadow: 0 5px 0 rgba(118, 72, 20, 0.12);
        color: #33220f;
        font-weight: 1000;
      }

      .roster-card.locked {
        opacity: 0.55;
        filter: grayscale(0.8);
      }

      .roster-card.locked .hero-mini > img {
        filter: brightness(0.1) saturate(0);
      }

      .roster-card .hero-mini {
        width: 96px;
        height: 108px;
        scale: 1;
        margin: -5px auto -4px;
      }

      .roster-card span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.82rem;
      }

      .class-icon {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: inline-grid;
        place-items: center;
        position: relative;
        flex: 0 0 auto;
        overflow: hidden;
        padding: 1px;
        background: radial-gradient(circle at 35% 24%, #fff8bd, #f7b13c 72%);
        border: 2px solid rgba(82, 49, 16, 0.36);
        box-shadow: 0 3px 0 rgba(86, 48, 14, 0.2);
      }

      .class-icon img {
        width: 142%;
        height: 142%;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 2px 1px rgba(70, 37, 9, 0.28));
      }

      .hero-detail {
        display: grid;
        gap: 12px;
      }

      .hero-detail-head {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 12px;
      }

      .hero-detail-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .hero-detail-stats span {
        min-height: 54px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        text-align: center;
        background: rgba(36, 39, 55, 0.9);
        color: #fff4cd;
        font-weight: 1000;
        font-size: 0.78rem;
      }

      .summon-orb {
        min-height: 210px;
        border-radius: 25px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 18px;
        background:
          radial-gradient(circle at 50% 38%, rgba(255,255,255,0.94), rgba(255,230,119,0.9) 22%, rgba(255,148,63,0.65) 42%, transparent 43%),
          linear-gradient(160deg, rgba(122, 85, 196, 0.3), rgba(255, 200, 83, 0.74));
        border: 3px solid rgba(105, 70, 26, 0.25);
        box-shadow: inset 0 0 50px rgba(255,255,255,0.5), 0 8px 0 rgba(117, 70, 18, 0.16);
      }

      .summon-orb strong {
        font-size: 2.3rem;
        color: #4a2c13;
        text-shadow: 0 2px 0 rgba(255,255,255,0.45);
      }

          { id: "moises", name: "Moisés", rarity: "legendary", role: "Cajado e sinais", classId: "support", hp: 120, atk: 13, spd: 0.95, skill: "Cajado dos Sinais: cura o aliado mais ferido e acelera o próximo turno." },
          { id: "arao", name: "Arão", rarity: "epic", role: "Sacerdote de Israel", classId: "support", hp: 115, atk: 11, spd: 0.98, skill: "Bênção Sacerdotal: restaura a vida do aliado mais ferido." },
          { id: "miria", name: "Miriã", rarity: "rare", role: "Cântico de coragem", classId: "support", hp: 98, atk: 10, spd: 1.12, skill: "Cântico da Travessia: cura o aliado mais ferido." },
          { id: "bezalel", name: "Bezalel", rarity: "rare", role: "Arco de artífice", classId: "ranged", hp: 94, atk: 14, spd: 1.10, projectile: "arrow", skill: "Disparo Trabalhado: o quarto disparo causa dano ampliado." },
          { id: "hur", name: "Hur", rarity: "uncommon", role: "Escudo e cajado", classId: "melee", hp: 138, atk: 12, spd: 0.90, skill: "Postura Firme: o quarto golpe causa dano ampliado." },
          { id: "nadabe", name: "Nadabe", rarity: "rare", role: "Machado cerimonial", classId: "melee", hp: 120, atk: 15, spd: 1.00, skill: "Golpe Cerimonial: o quarto golpe causa dano ampliado." },
          { id: "abiu", name: "Abiú", rarity: "rare", role: "Lâmina curva", classId: "melee", hp: 118, atk: 15, spd: 1.02, skill: "Lâmina Ardente: o quarto golpe causa dano ampliado." },
          { id: "eleazar", name: "Eleazar", rarity: "uncommon", role: "Lança cerimonial", classId: "melee", hp: 128, atk: 13, spd: 0.97, skill: "Lança Consagrada: o quarto golpe causa dano ampliado." }
        ];

        const bibleBooks = ["Gênesis", "Êxodo", "Levítico"];
        const levelNames = ["Porta de Entrada", "Travessia", "Cerco", "Provação", "Conquista"];
        const arenaThemes = [
          {
            id: "genesis",
            arena: "heroi-arena-genesis.png",
            enemyPool: [
              { id: "serpente-do-ermo", name: "Serpente do Ermo" },
              { id: "espinheiro-bravo", name: "Espinheiro Bravo" },
              { id: "fera-do-campo", name: "Fera do Campo" }
            ]
          },
          {
            id: "exodo",
            arena: "heroi-arena-exodo.png",
            enemyPool: [
              { id: "feitor-egipcio", name: "Feitor Egípcio" },
              { id: "cocheiro-do-farao", name: "Cocheiro do Faraó" },
              { id: "lanceiro-do-egito", name: "Lanceiro do Egito" }
            ]
          },
          {
            id: "levitico",
            arena: "heroi-arena-levitico.png",
            enemyPool: [
              { id: "escorpiao-do-deserto", name: "Escorpião do Deserto" },
              { id: "fera-impura", name: "Fera Impura" },
              { id: "invasor-do-acampamento", name: "Invasor do Acampamento" }
            ]
          }
        ];
        const stages = bibleBooks.flatMap((book, bookIndex) => {
          const theme = arenaThemes[bookIndex % arenaThemes.length];
          return levelNames.map((levelName, levelIndex) => {
            const id = bookIndex * 5 + levelIndex + 1;
            return {
              id,
              campaign: bookIndex + 1,
              level: levelIndex + 1,
              book,
              name: levelName,
              title: `${book} ${levelIndex + 1}`,
              tip: `Campanha ${bookIndex + 1}: ${book}, nível ${levelIndex + 1} de 5.`,
              cost: arenaEnergyCost,
              enemies: Math.min(4, [1, 2, 2, 3, 3][levelIndex] + Math.floor(bookIndex / 2)),
              arena: theme.arena,
              themeId: theme.id,
              enemyPool: theme.enemyPool
            };
          });
        });

        const upgrades = [
          { id: "fervor", title: "Fervor", text: "+18% de ataque nesta fase.", apply: s => s.bonusAtk += 0.18 },
          { id: "vigilia", title: "Vigília", text: "+24 de vida para todos.", apply: s => {
            s.bonusHp += 24;
            s.party.forEach(unit => {
              unit.maxHp += 24;
              unit.hp = Math.min(unit.maxHp, unit.hp + 24);
            });
          } },
          { id: "disciplina", title: "Disciplina", text: "Ataques ficam mais rápidos.", apply: s => s.bonusSpeed += 0.16 },
          { id: "provisao", title: "Provisão", text: "Ganhe 45 moedas agora.", apply: s => { state.coins += 45; } },
          { id: "salmo", title: "Salmo", text: "Cura parcial da equipe.", apply: s => { s.party.forEach(unit => unit.hp = Math.min(unit.maxHp, unit.hp + 28)); } }
        ];

        const checkinRewards = [
          { gems: 120, coins: 80 },
          { coins: 120 },
          { gems: 25 },
          { coins: 160 },
          { tickets: 1 },
          { gems: 35 },
          { coins: 220 },
          { gems: 30, coins: 120 },
          { coins: 260 },
          { tickets: 1 },
          { gems: 45 },
          { coins: 320 },
          { gems: 35, coins: 160 },
          { tickets: 1 },
          { gems: 60 },
          { coins: 400 },
          { gems: 45, coins: 180 },
          { coins: 460 },
          { tickets: 1 },
          { gems: 75 },
          { coins: 540 },
          { gems: 55, coins: 220 },
          { coins: 620 },
          { tickets: 1 },
          { gems: 90 },
          { coins: 720 },
          { gems: 70, coins: 260 },
          { tickets: 1, coins: 300 },
          { gems: 100 },
          { tickets: 2, gems: 120, coins: 500 }
        ];

        const state = load();
        const els = {
          app: document.getElementById("app"),
          avatar: document.getElementById("avatar"),
          xpBar: document.getElementById("xp-bar"),
          player: document.getElementById("player-name"),
          energy: document.getElementById("energy"),
          gems: document.getElementById("gems"),
          coins: document.getElementById("coins"),
          tickets: document.getElementById("tickets"),
          campaignLabel: document.getElementById("campaign-label"),
          levelLabel: document.getElementById("level-label"),
          prevStage: document.getElementById("prev-stage"),
          nextStage: document.getElementById("next-stage"),
          party: document.getElementById("party-yard"),
          sheet: document.getElementById("sheet"),
          toast: document.getElementById("toast"),
          nav: Array.from(document.querySelectorAll(".nav button")),
          battle: document.getElementById("battle"),
          arena: document.getElementById("arena"),
          battleLog: document.getElementById("battle-log"),
          choices: document.getElementById("choices"),
          result: document.getElementById("result"),
          battleWave: document.getElementById("battle-wave"),
          battleTitle: document.getElementById("battle-title"),
          battleEnergy: document.getElementById("battle-energy"),
          checkinBadge: document.getElementById("checkin-badge")
        };

        let battle = null;
        let timer = null;
        let visualTimer = null;
        let checkinTimer = null;

        document.querySelectorAll("[data-view]").forEach(button => {
          button.addEventListener("click", () => openView(button.dataset.view));
        });
        els.prevStage.addEventListener("click", () => selectStage(state.selectedStage - 1));
        els.nextStage.addEventListener("click", () => selectStage(state.selectedStage + 1));
        document.getElementById("start-button").addEventListener("click", () => {
          if (!state.owned.length) {
            if (state.gems < summonGemCost && state.tickets < 1) {
              toast("Faça o check-in para ganhar as gemas da primeira invocação.");
              renderCheckin(true);
            } else {
              toast("Faça a primeira invocação para liberar a equipe.");
              openView("summon");
            }
            return;
          }
          startBattle(state.selectedStage);
        });
        document.getElementById("battle-exit").addEventListener("click", endBattle);
        document.getElementById("checkin-btn").addEventListener("click", renderCheckin);
        document.getElementById("sound-btn").addEventListener("click", () => {
          state.sound = !state.sound;
          save();
          render();
          toast(state.sound ? "Som marcado como ligado." : "Som marcado como pausado.");
        });

        applyEnergyRegen();
        render();
        if (!state.seenIntro) {
          state.seenIntro = true;
          save();
          setTimeout(() => renderCheckin(true), 650);
        }

        function defaultState() {
          return {
            name: hubUser.name || "Peregrino",
            level: 1,
            xp: 0,
            energy: 60,
            gems: 0,
            coins: 0,
            tickets: 0,
            stage: 1,
            selectedStage: 1,
            highestStage: 1,
            completedStage: 0,
            owned: [],
            formation: [],
            heroLevels: {},
            summons: 0,
            checkinDay: 0,
            lastCheckinAt: 0,
            lastEnergyAt: Date.now(),
            sound: true,
            seenIntro: false
          };
        }

        function load() {
          const source = boot.state || safeLocalState();
          const merged = { ...defaultState(), ...(source || {}) };
          merged.name = hubUser.name || merged.name || "Peregrino";
          merged.highestStage = Math.min(stages.length, Math.max(1, Number(merged.highestStage || merged.stage || 1)));
          merged.selectedStage = Math.min(Math.max(1, Number(merged.selectedStage || merged.stage || merged.highestStage || 1)), merged.highestStage);
          merged.completedStage = Math.max(0, Number(merged.completedStage || Math.max(0, merged.highestStage - 1)));
          merged.heroLevels = merged.heroLevels && typeof merged.heroLevels === "object" ? merged.heroLevels : {};
          merged.formation = Array.from(new Set((merged.formation || []).filter(id => (merged.owned || []).includes(id)))).slice(0, maxFormation);
          merged.owned = Array.from(new Set(merged.owned || []));
          return merged;
        }

        function safeLocalState() {
          try {
            return JSON.parse(localStorage.getItem(saveKey) || "{}");
          } catch {
            return null;
          }
        }

        function save() {
          state.name = hubUser.name || state.name;
          localStorage.setItem(saveKey, JSON.stringify(state));
          if (location.protocol.startsWith("http")) {
            fetch("/api/heroi-ortodoxo/save", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ state })
            }).catch(() => {});
          }
        }

        function render() {
          applyEnergyRegen();
          const levelProgress = Math.min(100, (state.xp % 100));
          els.avatar.dataset.level = state.level;
          if (hubUser.avatarData && !els.avatar.querySelector("img")) {
            els.avatar.innerHTML = `<img src="${escapeAttr(hubUser.avatarData)}" alt="">`;
          }
          els.player.textContent = state.name;
          els.xpBar.style.width = `${levelProgress}%`;
          els.energy.textContent = `${state.energy}/${maxEnergy}`;
          els.gems.textContent = state.gems;
          els.coins.textContent = state.coins;
          els.tickets.textContent = state.tickets;
          els.battleEnergy.textContent = state.energy;
          const activeStage = getStage(state.selectedStage);
          els.campaignLabel.textContent = `Campanha ${activeStage.campaign}: ${activeStage.book}`;
          els.levelLabel.textContent = `Nível ${activeStage.level} de 5`;
          els.prevStage.disabled = state.selectedStage <= 1;
          els.nextStage.disabled = state.selectedStage >= state.highestStage;
          els.checkinBadge.classList.toggle("hidden", canCheckin() === false);
          document.getElementById("sound-btn").textContent = state.sound ? "II" : "M";
          renderParty();
        }

        function renderParty() {
          const ids = currentFormation();
          els.party.innerHTML = ids.map((id, index) => {
            const hero = heroById(id);
            const left = [10, 28, 46, 64, 82][index] || 46;
            const top = [24, 4, 22, 4, 24][index] || 22;
            return `<div class="chibi" style="left:${left}%;top:${top}px"><img src="${heroAsset(hero, "side-idle")}?v=${assetVersion}" alt="${hero.name}"></div>`;
          }).join("");
        }

        function currentFormation() {
          const fallback = state.owned.slice(0, maxFormation);
          const picked = state.formation.filter(id => state.owned.includes(id));
          const merged = [...picked, ...fallback.filter(id => !picked.includes(id))];
          return merged.slice(0, maxFormation);
        }

        function heroById(id) {
          return heroes.find(hero => hero.id === id) || heroes[0];
        }

        function heroAsset(hero, file) {
          return `/assets/heroi-ortodoxo/characters/${hero.id}/${file === "portrait" ? "portraits/front.png" : `combat/${file}.png`}`;
        }

        function heroPortrait(hero) {
          return `<div class="hero-mini"><img src="${heroAsset(hero, "portrait")}?v=${assetVersion}" alt=""></div>`;
        }

        function heroLevel(heroId) {
          return Math.max(1, Number(state.heroLevels[heroId] || 1));
        }

        function trainingCost(heroId) {
          return heroLevel(heroId) * 100;
        }

        function openView(view) {
          clearCheckinTimer();
          if (view === "home") {
            els.sheet.classList.add("hidden");
          } else if (view === "summon") {
            renderSummon();
          } else if (view === "heroes") {
            renderHeroes();
          } else if (view === "formation") {
            renderFormation();
          }
          els.nav.forEach(button => button.classList.toggle("active", button.dataset.view === view || (view === "home" && button.dataset.view === "home")));
        }

        function sheet(title, body) {
          els.sheet.innerHTML = `<div class="sheet-head"><div><h1>${title}</h1></div><button class="close-button" type="button" aria-label="Fechar">X</button></div>${body}`;
          els.sheet.querySelector(".close-button").addEventListener("click", () => {
            clearCheckinTimer();
            openView("home");
          });
          els.sheet.classList.remove("hidden");
        }

        function renderSummon() {
          sheet("Invocação", `
            <p>Use pergaminhos para chamar aliados bíblicos e fortalecer a equipe antes das arenas.</p>
            <div class="summon-orb"><strong>${state.tickets > 0 ? "1 livre" : `${summonGemCost} gemas`}</strong></div>
            <button class="primary-button" id="summon-now" type="button">${state.tickets > 0 ? "Invocar grátis" : "Invocar herói"}</button>
          `);
          document.getElementById("summon-now").addEventListener("click", summonHero);
        }

        function summonHero() {
          if (state.tickets <= 0 && state.gems < summonGemCost) {
            toast("Faltam gemas. Faça o check-in para começar.");
            renderCheckin(true);
            return;
          }
          if (state.tickets > 0) state.tickets -= 1;
          else state.gems -= summonGemCost;
          const pool = heroes.filter(hero => !state.owned.includes(hero.id));
          const next = state.summons === 0 && !state.owned.includes("davi")
            ? heroById("davi")
            : (pool.length ? pool[(state.summons + state.selectedStage) % pool.length] : heroes[(state.summons + 2) % heroes.length]);
          if (!state.owned.includes(next.id)) state.owned.push(next.id);
          if (!state.formation.includes(next.id) && state.formation.length < maxFormation) state.formation.push(next.id);
          state.summons += 1;
          state.xp += 20;
          levelCheck();
          save();
          render();
          sheet("Aliado chamado", `
            <div class="card hero-card">
              ${heroPortrait(next)}
              <div><h3>${next.name}</h3><p>${rarities[next.rarity].name} · ${className(next)}</p></div>
            </div>
            <button class="primary-button" id="go-formation" type="button">Ver formação</button>
          `);
          document.getElementById("go-formation").addEventListener("click", renderFormation);
        }

        function renderHeroes() {
          const cards = heroes.map(hero => {
            const owned = state.owned.includes(hero.id);
            return `<button class="roster-card ${owned ? "" : "locked"}" type="button" data-hero="${hero.id}" ${owned ? "" : "disabled"}>
              ${heroPortrait(hero)}
              <span>${owned ? hero.name : "Bloqueado"}</span>
            </button>`;
          }).join("");
          sheet("Heróis", `<div class="roster-grid">${cards}</div>`);
          bindHeroCards();
        }

        function renderFormation() {
          const slots = Array.from({ length: maxFormation }, (_, index) => {
            const id = currentFormation()[index];
            if (!id) return `<button class="slot" type="button" data-add="${index}">Vazio</button>`;
            const hero = heroById(id);
            return `<button class="slot filled" type="button" data-hero="${hero.id}">${renderClassIcon(hero)}${heroPortrait(hero)}<span>${hero.name}</span></button>`;
          }).join("");
          const bench = state.owned.map(id => {
            const hero = heroById(id);
            return `<button class="roster-card" type="button" data-pick="${hero.id}">
              ${renderClassIcon(hero)}
              ${heroPortrait(hero)}
              <span>${hero.name}</span>
            </button>`;
          }).join("") || `<div class="card"><b>Nenhum herói ainda</b><p>Faça uma invocação para montar a equipe.</p></div>`;
          sheet("Formação", `
            <div class="formation-board">${slots}</div>
            <h2>Personagens</h2>
            <div class="roster-grid">${bench}</div>
          `);
          bindHeroCards();
          els.sheet.querySelectorAll("[data-pick]").forEach(button => {
            button.addEventListener("click", () => {
              const id = button.dataset.pick;
              state.formation = state.formation.filter(item => item !== id);
              state.formation.unshift(id);
              state.formation = state.formation.slice(0, maxFormation);
              save();
              render();
              renderFormation();
            });
          });
        }

        function renderHeroDetail(heroId, returnView = "heroes") {
          const hero = heroById(heroId);
          const owned = state.owned.includes(hero.id);
          const level = heroLevel(hero.id);
          const cost = trainingCost(hero.id);
          sheet(hero.name, `
            <div class="hero-detail">
              <div class="hero-detail-head">
                ${heroPortrait(hero)}
                <div>
                  <div class="hero-line"><h3>${owned ? hero.name : "Bloqueado"}</h3>${renderClassIcon(hero)}</div>
                  <p>${owned ? `${rarities[hero.rarity].name} · Nível ${level}` : "Invoque este personagem para revelar seus detalhes completos."}</p>
                </div>
              </div>
              ${owned ? `<div class="hero-detail-stats">
                <span>ATQ<br>${hero.atk + (level - 1) * 2}</span>
                <span>HP<br>${hero.hp + (level - 1) * 10}</span>
                <span>Classe<br>${className(hero)}</span>
              </div>
              <div class="card"><b>Habilidade especial</b><p>${hero.skill}</p></div>
              <button class="primary-button" id="train-hero" type="button" ${state.coins < cost ? "disabled" : ""}>Treinar · ${cost} moedas</button>` : ""}
              <button class="primary-button" id="hero-back" type="button">Voltar</button>
            </div>
          `);
          document.getElementById("train-hero")?.addEventListener("click", () => trainHero(hero.id, returnView));
          document.getElementById("hero-back").addEventListener("click", () => {
            if (returnView === "formation") renderFormation();
            else renderHeroes();
          });
        }

        function trainHero(heroId, returnView) {
          const cost = trainingCost(heroId);
          if (state.coins < cost) {
            toast("Moedas insuficientes.");
            return;
          }
          state.coins -= cost;
          state.heroLevels[heroId] = heroLevel(heroId) + 1;
          save();
          render();
          renderHeroDetail(heroId, returnView);
          toast("Treinamento concluído.");
        }

        function bindHeroCards() {
          els.sheet.querySelectorAll(".roster-grid [data-hero]").forEach(button => {
            button.addEventListener("click", () => renderHeroDetail(button.dataset.hero, "heroes"));
          });
          els.sheet.querySelectorAll(".formation-board [data-hero]").forEach(button => {
            button.addEventListener("click", event => {
              event.stopPropagation();
              renderHeroDetail(button.dataset.hero, "formation");
            });
          });
        }

        function className(hero) {
          return classes[hero.classId]?.name || "Herói";
        }

        function classIcon(hero) {
          return classes[hero.classId]?.icon || "melee";
        }

        function classImage(hero) {
          return classes[hero.classId]?.image || classes.melee.image;
        }

        function renderClassIcon(hero) {
          const label = className(hero);
          return `<span class="class-icon ${classIcon(hero)}" aria-label="${label}" title="${label}"><img src="${classImage(hero)}?v=${assetVersion}" alt=""></span>`;
        }

        function getStage(stageId) {
          return stages.find(item => item.id === stageId) || stages[0];
        }

        function selectStage(stageId) {
          state.selectedStage = Math.min(Math.max(1, stageId), state.highestStage);
          save();
          render();
        }

        function startBattle(stageId) {
          const stage = getStage(stageId);
          if (stage.id > state.highestStage) {
            toast("Conclua o nível anterior para liberar este.");
            selectStage(state.highestStage);
            return;
          }
          if (!state.owned.length) {
            toast("Invoque pelo menos um herói antes da arena.");
            openView("summon");
            return;
          }
          if (state.energy < stage.cost) {
            toast(`Energia insuficiente. Cada arena custa ${arenaEnergyCost} energia.`);
            return;
          }
          state.energy -= stage.cost;
          battle = {
            stage,
            time: 0,
            wave: 1,
            bonusAtk: 0,
            bonusHp: 0,
            bonusSpeed: 0,
            paused: false,
            party: currentFormation().map((id, index) => makeHero(heroById(id), index)),
            enemies: makeEnemies(stage, 1)
          };
          els.sheet.classList.add("hidden");
          els.app.classList.add("battle-active");
          els.battle.classList.remove("hidden");
          els.battle.style.setProperty("--arena-image", `url("/assets/${stage.arena}?v=20260710f")`);
          els.result.classList.add("hidden");
          els.choices.classList.add("hidden");
          els.battleTitle.textContent = `${stage.book} ${stage.level}`;
          els.arena.querySelectorAll(".fighter, .projectile").forEach(node => node.remove());
          save();
          render();
          drawBattle();
          log("A arena começou. Seus heróis atacam automaticamente.");
          clearInterval(timer);
          clearInterval(visualTimer);
          timer = setInterval(tick, 120);
          visualTimer = setInterval(drawBattle, 50);
        }

        function makeHero(hero, index) {
          const level = heroLevel(hero.id);
          const hp = hero.hp + (level - 1) * 10 + (state.level - 1) * 6;
          return {
            side: "hero",
            id: hero.id,
            name: hero.name,
            assetId: hero.id,
            classId: hero.classId,
            projectile: hero.projectile || "",
            maxHp: hp,
            hp,
            atk: hero.atk + (level - 1) * 2 + Math.floor(state.level / 2),
            spd: hero.spd,
            x: 18,
            y: [23, 36, 50, 64, 77][index] || 50,
            cd: index * 0.12,
            attackCount: 0,
            animation: null
          };
        }

        function makeEnemies(stage, wave) {
          const count = Math.max(1, Math.min(3, stage.enemies - (wave - 1)));
          return Array.from({ length: count }, (_, index) => {
            const template = stage.enemyPool[(index + wave - 1) % stage.enemyPool.length];
            const hp = 22 + stage.campaign * 3 + stage.level * 5 + wave * 3;
            return {
              side: "enemy",
              id: `enemy-${stage.id}-${wave}-${index}`,
              name: template.name,
              assetId: template.id,
              themeId: stage.themeId,
              maxHp: hp,
              hp,
              atk: 2 + stage.level + Math.floor(stage.campaign / 2) + wave,
              spd: 0.65 + stage.level * 0.04 + stage.campaign * 0.02,
              x: [72, 79, 72][index] || 72,
              y: [18, 50, 82][index] || 50,
              cd: 0.55 + index * 0.32,
              attackCount: 0,
              animation: null
            };
          });
        }

        function tick() {
          if (!battle || battle.paused) return;
          battle.time += 0.12;
          [...battle.party, ...battle.enemies].forEach(unit => {
            if (unit.hp <= 0) return;
            unit.cd -= (unit.spd + battle.bonusSpeed) * 0.12;
            if (unit.cd <= 0) {
              attack(unit);
              unit.cd = unit.side === "hero" ? 1.18 : 1.35;
            }
          });
          battle.enemies = battle.enemies.filter(unit => unit.hp > 0);
          battle.party = battle.party.filter(unit => unit.hp > 0);

          if (!battle.party.length) {
            finish(false);
            return;
          }
          if (!battle.enemies.length) {
            if (battle.wave < 2 && (battle.stage.level > 1 || battle.stage.campaign > 1)) {
              showChoices();
            } else {
              finish(true);
            }
          }
        }

        function attack(unit) {
          const targets = unit.side === "hero" ? battle.enemies : battle.party;
          const target = targets.find(item => item.hp > 0);
          if (!target) return;
          unit.attackCount += 1;
          const special = unit.side === "hero" && unit.attackCount % 4 === 0;
          unit.animation = { kind: special && unit.classId === "support" ? "skill" : "attack", startedAt: Date.now() };
          const activeBattle = battle;

          if (special && unit.classId === "support") {
            const healing = Math.max(12, Math.round(unit.atk * 1.7));
            setTimeout(() => {
              if (battle !== activeBattle || battle.paused) return;
              const attacker = battle.party.find(item => item.id === unit.id && item.hp > 0);
              if (!attacker) return;
              const ally = battle.party.filter(item => item.hp > 0).sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0];
              if (!ally) return;
              ally.hp = Math.min(ally.maxHp, ally.hp + healing);
              log(`${unit.name} restaurou ${healing} de vida.`);
            }, 520);
            return;
          }

          const multiplier = special ? 1.55 : 1;
          const damage = Math.max(3, Math.round(unit.atk * multiplier * (unit.side === "hero" ? 1 + battle.bonusAtk : 1)));
          if (unit.side === "hero" && unit.projectile) {
            setTimeout(() => {
              if (battle !== activeBattle || battle.paused) return;
              const attacker = battle.party.find(item => item.id === unit.id && item.hp > 0);
              if (attacker) launchProjectile(unit, target);
            }, 220);
          }
          const impactDelay = unit.projectile ? 800 : (unit.side === "enemy" ? 470 : 450);
          setTimeout(() => {
            if (battle !== activeBattle || battle.paused) return;
            const attackers = unit.side === "hero" ? battle.party : battle.enemies;
            if (!attackers.some(item => item.id === unit.id && item.hp > 0)) return;
            const liveTargets = unit.side === "hero" ? battle.enemies : battle.party;
            const liveTarget = liveTargets.find(item => item.id === target.id && item.hp > 0) || liveTargets.find(item => item.hp > 0);
            if (!liveTarget) return;
            liveTarget.hp -= damage;
            liveTarget.animation = { kind: "hurt", startedAt: Date.now() };
            log(`${unit.name} causou ${damage} de dano${special ? " crítico" : ""}.`);
          }, impactDelay);
        }

        function launchProjectile(unit, target) {
          const type = unit.projectile === "stone" ? "stone" : "arrow";
          const node = document.createElement("span");
          node.className = `projectile ${type}`;
          node.style.setProperty("--from-x", `${unit.x + 3}%`);
          node.style.setProperty("--from-y", `${unit.y}%`);
          node.style.setProperty("--to-x", `${target.x - 3}%`);
          node.style.setProperty("--to-y", `${target.y}%`);
          node.innerHTML = `<img src="/assets/heroi-ortodoxo/projectiles/${type}.png?v=${assetVersion}" alt="">`;
          els.arena.appendChild(node);
          setTimeout(() => node.remove(), 660);
        }

        function unitSprite(unit, now) {
          const animation = unit.animation;
          const age = animation ? now - animation.startedAt : Number.POSITIVE_INFINITY;
          if (unit.side === "enemy") {
            const root = `/assets/heroi-ortodoxo/enemies/${unit.themeId}/${unit.assetId}`;
            if (animation?.kind === "hurt" && age < 560) return `${root}/frames/frame-04.png`;
            if (animation?.kind === "attack" && age < 840) {
              if (age < 280) return `${root}/frames/frame-02.png`;
              if (age < 650) return `${root}/frames/frame-03.png`;
            }
            return `${root}/side-idle.png`;
          }

          const root = `/assets/heroi-ortodoxo/characters/${unit.assetId}/combat`;
          if (animation?.kind === "hurt" && age < 560) {
            const frame = Math.min(4, Math.floor(age / 140) + 1);
            return `${root}/hurt/frame-${String(frame).padStart(2, "0")}.png`;
          }
          const motionDuration = animation?.kind === "skill" ? 900 : 860;
          if ((animation?.kind === "attack" || animation?.kind === "skill") && age < motionDuration) {
            const folder = animation.kind === "skill" ? "skill-cast" : (unit.assetId === "davi" ? "attack-sling" : "attack");
            const count = animation.kind === "skill" ? 6 : 5;
            const frame = Math.min(count, Math.floor(age / (motionDuration / count)) + 1);
            return `${root}/${folder}/frame-${String(frame).padStart(2, "0")}.png`;
          }
          return `${root}/side-idle.png`;
        }

        function drawBattle() {
          if (!battle) return;
          els.battleWave.textContent = `Campanha ${battle.stage.campaign} · Nível ${battle.stage.level} · Onda ${battle.wave}`;
          const now = Date.now();
          const units = [...battle.party, ...battle.enemies];
          const activeIds = new Set(units.map(unit => unit.id));
          els.arena.querySelectorAll(".fighter").forEach(node => {
            if (!activeIds.has(node.dataset.unit)) node.remove();
          });

          units.forEach(unit => {
            const hp = Math.max(0, Math.round((unit.hp / unit.maxHp) * 100));
            const age = unit.animation ? now - unit.animation.startedAt : Number.POSITIVE_INFINITY;
            const actionDuration = unit.animation?.kind === "hurt" ? 560 : (unit.animation?.kind === "skill" ? 900 : 860);
            const actionClass = age < actionDuration ? (unit.animation.kind === "hurt" ? "hurt" : "attacking") : "";
            let node = Array.from(els.arena.querySelectorAll(".fighter")).find(item => item.dataset.unit === unit.id);
            if (!node) {
              node = document.createElement("div");
              node.className = `fighter ${unit.side} ${unit.classId || "melee"}`;
              node.dataset.unit = unit.id;
              node.innerHTML = `<img class="unit-sprite" alt=""><div class="unit-meta"><span class="unit-name"></span><div class="hp"><span></span></div></div>`;
              node.querySelector(".unit-name").textContent = unit.name;
              els.arena.appendChild(node);
            }
            node.style.left = `${unit.x}%`;
            node.style.top = `${unit.y}%`;
            node.style.zIndex = String(Math.round(unit.y));
            const actionKey = actionClass ? `${unit.animation.kind}-${unit.animation.startedAt}` : "idle";
            if (node.dataset.actionKey !== actionKey) {
              node.classList.remove("attacking", "hurt");
              if (actionClass) {
                void node.offsetWidth;
                node.classList.add(actionClass);
              }
              node.dataset.actionKey = actionKey;
            }
            const sprite = `${unitSprite(unit, now)}?v=${assetVersion}`;
            const image = node.querySelector(".unit-sprite");
            if (image.dataset.sprite !== sprite) {
              image.src = sprite;
              image.dataset.sprite = sprite;
            }
            node.querySelector(".hp").style.setProperty("--hp", `${hp}%`);
          });
        }

        function showChoices() {
          battle.paused = true;
          const options = upgrades.slice().sort(() => Math.random() - 0.5).slice(0, 3);
          els.choices.innerHTML = `<div class="choice-panel"><h2>Escolha uma bênção</h2>${options.map(item => `
            <button type="button" class="choice-card" data-upgrade="${item.id}">
              <span class="choice-icon">${item.title.slice(0, 1)}</span>
              <span><b>${item.title}</b><p>${item.text}</p></span>
            </button>`).join("")}</div>`;
          els.choices.classList.remove("hidden");
          els.choices.querySelectorAll("[data-upgrade]").forEach(button => {
            button.addEventListener("click", () => {
              const chosen = upgrades.find(item => item.id === button.dataset.upgrade);
              chosen.apply(battle);
              battle.wave += 1;
              battle.enemies = makeEnemies(battle.stage, battle.wave);
              battle.paused = false;
              els.choices.classList.add("hidden");
              log(`${chosen.title} aplicada. Próxima onda!`);
              save();
              render();
              drawBattle();
            });
          });
        }

        function finish(win) {
          clearInterval(timer);
          clearInterval(visualTimer);
          timer = null;
          visualTimer = null;
          if (win) {
            const firstClear = battle.stage.id > state.completedStage;
            const rewards = stageRewards(battle.stage, firstClear);
            state.coins += rewards.coins;
            state.gems += rewards.gems;
            state.xp += rewards.xp;
            state.completedStage = Math.max(state.completedStage, battle.stage.id);
            state.highestStage = Math.max(state.highestStage, Math.min(stages.length, battle.stage.id + 1));
            state.selectedStage = Math.min(stages.length, battle.stage.id + 1);
            state.stage = state.selectedStage;
            levelCheck();
            save();
            render();
            els.result.innerHTML = `<article class="result-card"><h2>Vitória!</h2><div class="reward-row">
              <span class="reward-pill"><img src="/assets/heroi-icon-coins.png?v=20260710h" alt=""><b>+${rewards.coins}</b></span>
              <span class="reward-pill"><img src="/assets/heroi-icon-gems.png?v=20260710h" alt=""><b>+${rewards.gems}</b></span>
              <span class="reward-pill"><b>XP</b><strong>+${rewards.xp}</strong></span>
            </div><button class="primary-button" id="result-close" type="button">Voltar ao acampamento</button></article>`;
          } else {
            save();
            render();
            els.result.innerHTML = `<article class="result-card"><h2>Derrota</h2><button class="primary-button" id="result-close" type="button">Voltar ao acampamento</button></article>`;
          }
          els.result.classList.remove("hidden");
          document.getElementById("result-close").addEventListener("click", endBattle);
        }

        function stageRewards(stage, firstClear) {
          return {
            coins: 70 + stage.level * 25 + stage.campaign * 20,
            gems: firstClear ? 12 + stage.level * 4 + stage.campaign * 2 : 2 + stage.campaign,
            xp: 35 + stage.level * 12 + stage.campaign * 4
          };
        }

        function endBattle() {
          clearInterval(timer);
          clearInterval(visualTimer);
          timer = null;
          visualTimer = null;
          battle = null;
          els.arena.querySelectorAll(".fighter, .projectile").forEach(node => node.remove());
          els.app.classList.remove("battle-active");
          els.battle.classList.add("hidden");
          els.result.classList.add("hidden");
          els.choices.classList.add("hidden");
          openView("home");
          render();
        }

        function log(text) {
          els.battleLog.textContent = text;
        }

        function renderCheckin(isTutorial = false) {
          clearCheckinTimer();
          const currentDay = Math.min(state.checkinDay, checkinRewards.length - 1);
          const claimable = canCheckin() && state.checkinDay < checkinRewards.length;
          const statusChip = state.checkinDay >= checkinRewards.length
            ? `<span class="checkin-status">Completo</span>`
            : (claimable ? "" : `<span class="checkin-status" id="checkin-countdown">${formatDuration(nextCheckinIn())}</span>`);
          const cards = checkinRewards.map((reward, index) => {
            const claimed = index < state.checkinDay;
            const current = index === state.checkinDay && state.checkinDay < checkinRewards.length;
            const status = claimed ? "Coletado" : (current ? (claimable ? "Hoje" : "Próximo") : "Bloq.");
            return `<article class="day-reward ${claimed ? "claimed" : current ? "current" : "locked"}">
              <b>Dia ${index + 1}</b>
              <img src="${rewardIcon(reward)}" alt="">
              <span>${rewardText(reward)}</span>
              <small>${status}</small>
            </article>`;
          }).join("");

          sheet("Check-in diário", `
            <div class="checkin-summary">
              <strong>Dia ${Math.min(state.checkinDay + 1, 30)} de 30</strong>
              ${statusChip}
            </div>
            <button class="primary-button" id="claim-checkin" type="button" ${claimable ? "" : "disabled"}>${claimable ? "Coletar" : "Aguardar"}</button>
            <div class="checkin-grid">${cards}</div>
          `);

          const claimButton = document.getElementById("claim-checkin");
          claimButton.addEventListener("click", claimCheckin);
          checkinTimer = window.setInterval(updateCheckinCountdown, 1000);
          updateCheckinCountdown();
        }

        function claimCheckin() {
          if (!canCheckin()) {
            toast(`Próximo check-in em ${formatDuration(nextCheckinIn())}.`);
            return;
          }
          if (state.checkinDay >= checkinRewards.length) {
            toast("Você completou os 30 dias deste ciclo.");
            return;
          }
          const reward = checkinRewards[state.checkinDay];
          applyReward(reward);
          state.checkinDay += 1;
          state.lastCheckinAt = Date.now();
          save();
          render();
          toast(`Check-in coletado: ${rewardText(reward)}.`);
          renderCheckin();
        }

        function applyReward(reward) {
          state.gems += reward.gems || 0;
          state.coins += reward.coins || 0;
          state.tickets += reward.tickets || 0;
          if (reward.energy) state.energy = Math.min(maxEnergy, state.energy + reward.energy);
        }

        function rewardIcon(reward) {
          if (reward.tickets) return "/assets/heroi-icon-scroll.png?v=20260710h";
          if (reward.gems) return "/assets/heroi-icon-gems.png?v=20260710h";
          if (reward.coins) return "/assets/heroi-icon-coins.png?v=20260710h";
          return "/assets/heroi-icon-gift.png?v=20260710h";
        }

        function rewardText(reward) {
          return [
            reward.gems ? `${reward.gems} gemas` : "",
            reward.coins ? `${reward.coins} moedas` : "",
            reward.tickets ? `${reward.tickets} perg.` : "",
            reward.energy ? `${reward.energy} energia` : ""
          ].filter(Boolean).join(" + ");
        }

        function canCheckin() {
          return !state.lastCheckinAt || Date.now() - state.lastCheckinAt >= checkinCooldownMs;
        }

        function nextCheckinIn() {
          if (canCheckin()) return 0;
          return Math.max(0, checkinCooldownMs - (Date.now() - state.lastCheckinAt));
        }

        function updateCheckinCountdown() {
          const countdown = document.getElementById("checkin-countdown");
          const button = document.getElementById("claim-checkin");
          if (!button) return;
          const claimable = canCheckin() && state.checkinDay < checkinRewards.length;
          if (countdown) {
            countdown.textContent = state.checkinDay >= checkinRewards.length
              ? "Completo"
              : formatDuration(nextCheckinIn());
          }
          button.disabled = !claimable;
          button.textContent = claimable ? "Coletar" : "Aguardar";
        }

        function clearCheckinTimer() {
          if (checkinTimer) window.clearInterval(checkinTimer);
          checkinTimer = null;
        }

        function formatDuration(ms) {
          const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;
          if (hours > 0) return `${hours}h ${String(minutes).padStart(2, "0")}m`;
          return `${minutes}m ${String(seconds).padStart(2, "0")}s`;
        }

        function applyEnergyRegen() {
          const now = Date.now();
          if (!state.lastEnergyAt) state.lastEnergyAt = now;
          if (state.energy >= maxEnergy) {
            state.energy = maxEnergy;
            state.lastEnergyAt = now;
            return;
          }
          const gained = Math.floor((now - state.lastEnergyAt) / energyRegenMs);
          if (gained > 0) {
            state.energy = Math.min(maxEnergy, state.energy + gained);
            state.lastEnergyAt += gained * energyRegenMs;
            if (state.energy >= maxEnergy) state.lastEnergyAt = now;
            save();
          }
        }

        function levelCheck() {
          while (state.xp >= state.level * 100) {
            state.level += 1;
            state.energy = maxEnergy;
          }
        }

        function escapeAttr(value) {
          return String(value || "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char]));
        }

        function toast(text) {
          els.toast.textContent = text;
          els.toast.classList.add("show");
          window.clearTimeout(els.toast._timer);
          els.toast._timer = window.setTimeout(() => els.toast.classList.remove("show"), 2200);
        }
      })();
    </script>
  </body>
</html>
