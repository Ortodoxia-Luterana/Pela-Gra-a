        line-height: 1.45;
        font-size: 0.92rem;

        z-index: 2;

        color: var(--ivory);

        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 15px 44px rgba(0, 0, 0, 0.26);

        gap: 1rem;
        margin-bottom: 0.85rem;
      }

      .panel h2, .panel h3 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
      }

      .panel p { color: var(--muted); line-height: 1.5; }

      .book-card {
        min-height: 170px;
        border-radius: 18px;
        padding: 1rem;
        display: grid;
        align-content: end;
        border: 1px solid rgba(225, 179, 92, 0.24);

          linear-gradient(180deg, rgba(4, 11, 20, 0.08), rgba(4, 11, 20, 0.9)),

      .button-row {

        gap: 0.65rem;
        flex-wrap: wrap;
        margin-top: 0.85rem;

      .btn {

        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.75rem 1rem;

        background: linear-gradient(180deg, #f3d484, var(--bronze));

      }

      .meta {

      .small {

        align-content: center;
        justify-items: center;
        gap: 0.35rem;
        padding: 0.55rem;
        background: rgba(4, 11, 20, 0.42);
        text-align: center;

      .slot strong { font-size: 0.8rem; }
      .slot small { color: var(--muted); }

      .nav {

        left: 50%;
        bottom: 0;
        z-index: 30;
        width: min(100%, 520px);
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.25rem;
        padding: 0.55rem 0.65rem max(0.55rem, env(safe-area-inset-bottom));
        border-top: 1px solid rgba(225, 179, 92, 0.22);
        background: rgba(5, 13, 23, 0.94);
        backdrop-filter: blur(16px);

      .nav button {

        place-items: center;

      .modal {

        z-index: 60;

        place-items: end center;
        padding: 1rem;
        background: rgba(2, 5, 10, 0.76);
        backdrop-filter: blur(12px);

      .modal-card {

        border: 1px solid var(--line);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(18, 39, 60, 0.98), rgba(6, 13, 23, 0.98));
        box-shadow: var(--shadow);

      .summon-altar {

      .battle-screen {

      .battle-actions {

      .card-choice {

      .choice-card {
        border: 1px solid rgba(225, 179, 92, 0.34);

      .choice-card h3 { margin: 0.2rem 0 0.4rem; }
      .choice-card p { margin: 0; color: var(--muted); line-height: 1.42; }

      .toast {

        border: 1px solid rgba(225, 179, 92, 0.34);

        padding: 0.8rem 1rem;
        color: var(--ivory);
        background: rgba(6, 13, 23, 0.94);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.34);
      }

      @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(225, 179, 92, 0.3); }
        80% { transform: scale(1.06); box-shadow: 0 0 0 16px rgba(225, 179, 92, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(225, 179, 92, 0); }
      }

      @keyframes breathe {
        from { opacity: 0.74; }

      }

      @media (max-width: 380px) {
        .view { padding-inline: 0.7rem; }
        .topbar { grid-template-columns: 1fr; }
        .resource-row { justify-content: flex-start; }
        .two, .three { grid-template-columns: 1fr; }
        .slot-row { grid-template-columns: repeat(2, 1fr); }
        .nav { padding-inline: 0.35rem; }
        .nav button { font-size: 0.62rem; }
      }
    </style>

      function summon(count) {
        if (count === 10 && state.fragments < 1000 && state.tickets < 10) return toast("VocÃª precisa de 1.000 fragmentos ou 10 bilhetes.");
        if (count === 1 && state.fragments < 100 && state.tickets < 1) return toast("VocÃª precisa de fragmentos ou bilhete.");
        const results = [];
        for (let i = 0; i < count; i += 1) {
          if (state.tickets > 0) state.tickets -= 1;
          else state.fragments -= 100;
          const rarity = rollRarity();
          const pool = HEROES.filter((h) => h.rarity === rarity);
          const picked = pool[Math.floor(Math.random() * pool.length)];
          if (hasHero(picked.id)) {
            state.heroes[picked.id].shards = (state.heroes[picked.id].shards || 0) + RARITY[picked.rarity].shards;
            state.summonHistory.push(`${picked.name} duplicado: +${RARITY[picked.rarity].shards} fragmentos`);
          } else {
            unlockHero(picked.id);
            state.summonHistory.push(`${picked.name} desbloqueado`);
          }
          results.push(picked.id);
        }
        save();
        render();
        showHeroReveal(results, "Resultado da invocaÃ§Ã£o");
      }

      function rollRarity() {
        state.pity.rare += 1; state.pity.epic += 1; state.pity.legendary += 1;
        if (state.pity.legendary >= 100) return resetPity("lendario");
        if (state.pity.epic >= 40) return resetPity(Math.random() < 0.1 ? "lendario" : "epico");
        if (state.pity.rare >= 10) return resetPity(["raro", "epico", "lendario"][weighted([30, 9, 1])]);
        const rarity = ["comum", "raro", "epico", "lendario"][weighted([60, 30, 9, 1])];
        return resetPity(rarity);
      }

      function weighted(weights) {
        let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
        for (let i = 0; i < weights.length; i += 1) {
          roll -= weights[i];
          if (roll <= 0) return i;
        }
        return weights.length - 1;
      }

      function resetPity(rarity) {
        if (rarity === "raro" || rarity === "epico" || rarity === "lendario") state.pity.rare = 0;
        if (rarity === "epico" || rarity === "lendario") state.pity.epic = 0;
        if (rarity === "lendario") state.pity.legendary = 0;
        return rarity;
      }

        state.heroes[id] = { ...(state.heroes[id] || {}), unlocked: true, level: state.heroes[id]?.level || 1, stars: state.heroes[id]?.stars || 1, shards: state.heroes[id]?.shards || 0 };

      function upgradeHero(id) {
        const h = state.heroes[id];
        if (!h) return;
        const cost = (h.level || 1) * 70;
        if (state.coins < cost) return toast(`Faltam moedas. Custo: ${cost}.`);
        state.coins -= cost;
        h.level = (h.level || 1) + 1;
        state.missions.upgrade = 1;
        save();
        render();
        toast(`${hero(id).name} melhorado para nÃ­vel ${h.level}.`);
      }

      function chooseFormationSlot(slot) {
        const owned = HEROES.filter((h) => hasHero(h.id));
        showModal("Escolher herÃ³i", `<div class="grid two">${owned.map((h) => `<button class="hero-card" onclick="setFormation(${slot},'${h.id}')"><div class="portrait">${h.sigil}</div><h3>${h.name}</h3><p class="small">${h.role}</p></button>`).join("") || "<p>Nenhum herÃ³i disponÃ­vel.</p>"}</div>`);
      }

      function setFormation(slot, id) {
        state.formation = state.formation.map((current) => current === id ? null : current);
        state.formation[slot] = id;
        save();
        closeModal();
        render();
      }

      function quickAddFormation(id) {
        const empty = state.formation.findIndex((slot) => !slot);
        if (empty === -1) return toast("Todos os slots disponÃ­veis estÃ£o preenchidos.");
        setFormation(empty, id);
      }

      function claimDaily() {
        if (state.daily.claimedToday) return;
        const day = state.daily.day;
        if ([1, 8, 9, 13, 15, 19, 23, 27].includes(day)) state.fragments += 100;
        if ([2, 6, 11, 16, 20, 24].includes(day)) state.coins += 180;
        if ([5, 14, 25].includes(day)) state.tickets += day === 14 ? 10 : 1;
        if ([6, 10, 17, 22].includes(day)) state.energy += 3;
        if (day === 28) unlockHero(["jael", "benaia", "jonatas"].find((id) => !hasHero(id)) || "jael");
        state.daily.claimedToday = true;
        state.daily.last = new Date().toISOString();
        state.daily.day = Math.min(28, state.daily.day + 1);
        save();
        render();
        toast("Recompensa diÃ¡ria coletada.");
      }

      function showMissions() {
        showModal("MissÃµes diÃ¡rias", `
          <div class="grid">
            ${mission("Entrar no jogo", state.missions.login, 1, "Moedas")}
            ${mission("Concluir batalhas", state.missions.battles, 3, "Fragmentos de InvocaÃ§Ã£o")}
            ${mission("Escolher melhorias", state.missions.cards, 5, "ExperiÃªncia de conta")}
            ${mission("Melhorar um herÃ³i", state.missions.upgrade, 1, "Material de evoluÃ§Ã£o")}
          </div>
        `);
      }

      function mission(title, progress, goal, reward) {
        return `<article class="mission-card"><h3>${title}</h3><p class="small">${Math.min(progress || 0, goal)}/${goal} â€¢ ${reward}</p><div class="bar"><span style="width:${Math.min(100, ((progress || 0) / goal) * 100)}%"></span></div></article>`;
      }

      function showProbabilities() {
        showModal("Probabilidades", `<div class="grid">${Object.values(RARITY).map((r) => `<article class="reward-card"><h3>${r.label}</h3><p class="small">${r.chance}% por invocaÃ§Ã£o. Duplicata converte em fragmentos.</p></article>`).join("")}<p class="small">Raro garantido a cada 10, Ã©pico a cada 40 e lendÃ¡rio no mÃ¡ximo na 100Âª invocaÃ§Ã£o sem lendÃ¡rio.</p></div>`);
      }

      function showHeroReveal(ids, title) {
        showModal(title, `<div class="grid two">${ids.map((id) => heroCard(hero(id))).join("")}</div><button class="btn full" onclick="closeModal()">Continuar</button>`);
      }

      function openPreBattle(bookId, stageId) {
        const book = BOOKS.find((b) => b.id === bookId);
        const stage = book.stages.find((s) => s.id === stageId);
        if (!state.unlockedBooks.includes(book.id)) return toast("Livro ainda bloqueado.");
        if (!state.formation[0]) return toast("Escolha um capitÃ£o na FormaÃ§Ã£o.");
        showModal(`${book.title} ${stage.id}`, `
          <span class="eyebrow">${stage.scene}</span>
          <h2>${stage.title}</h2>
          <p>${stage.context}</p>
          <p class="small">Objetivo: vencer ${stage.waves} ondas${stage.boss ? " e derrotar o chefe" : ""}. Custo: 1 energia.</p>
          <div class="grid three" id="placement-grid">${[...Array(12)].map((_, i) => `<button class="slot" onclick="startBattle('${book.id}','${stage.id}',${i})">${i >= 6 ? "Posicionar" : "Frente"}</button>`).join("")}</div>
        `);
      }

      function startBattle(bookId, stageId, cellIndex) {
        if (state.energy <= 0) return toast("Sem energia.");
        state.energy -= 1;
        closeModal();
        const book = BOOKS.find((b) => b.id === bookId);
        const stage = book.stages.find((s) => s.id === stageId);
        const captain = hero(state.formation[0]);
        battle = {
          book, stage, tick: 0, wave: 1, spawned: 0, camp: 100, xp: 0, level: 1, paused: false,
          recruited: [captain.id], cardChoices: 0, placingRecruit: null, log: "Toque em Iniciar batalha.",
          heroes: [makeBattleHero(captain, cellIndex)],
          enemies: [], modifiers: { damage: 1, speed: 1, defense: 1, heal: 0 },
        };
        $("battle").classList.remove("hidden");
        renderBattle();
        save();
      }

      function makeBattleHero(h, cell) {
        const row = Math.floor(cell / 3);
        const col = cell % 3;
        const level = state.heroes[h.id]?.level || 1;
        return { id: h.id, name: h.name, sigil: h.sigil, hp: h.hp + level * 12, maxHp: h.hp + level * 12, atk: h.atk + level * 2, speed: h.speed, range: h.range, row, col, cd: 0 };
      }

      function makeEnemy(id, col) {
        const e = ENEMIES[id];
        return { id, name: e.name, hp: e.hp, maxHp: e.hp, atk: e.atk, speed: e.speed, xp: e.xp, ranged: e.ranged, boss: e.boss, row: 0, col, cd: 0, move: 0 };
      }

      function renderBattle() {
        if (!battle) return;
        $("battle").style.setProperty("--arena-bg", battle.book.bg);
        $("battle").innerHTML = `
          <header class="battle-top">
            <div class="battle-stats"><div><span class="eyebrow">${battle.book.title} ${battle.stage.id}</span><strong>${battle.stage.title}</strong></div><span class="chip">Onda ${Math.min(battle.wave, battle.stage.waves)}/${battle.stage.waves}</span></div>
            <div class="grid two">
              <div><small>Integridade</small><div class="bar"><span style="width:${battle.camp}%"></span></div></div>
              <div><small>XP da partida</small><div class="bar"><span style="width:${Math.min(100, battle.xp)}%"></span></div></div>
            </div>
          </header>
          <section class="arena">
            <div class="arena-bg"></div>
            <div class="battle-log">${battle.log}</div>
            <div class="field">${[...Array(12)].map((_, i) => renderCell(i)).join("")}</div>
          </section>
          <footer class="battle-actions">
            <button class="btn" onclick="runBattle()" ${loop ? "disabled" : ""}>${loop ? "Lutando" : "Iniciar"}</button>
            <button class="btn secondary" onclick="toggleSpeed()" ${state.completed["genesis-1-5"] ? "" : "disabled"}>2x</button>
            <button class="btn ghost" onclick="quitBattle()">Sair</button>
          </footer>
        `;
      }

      function renderCell(i) {
        const row = Math.floor(i / 3), col = i % 3;
        const h = battle.heroes.find((u) => u.row === row && u.col === col && u.hp > 0);
        const e = battle.enemies.find((u) => u.row === row && u.col === col && u.hp > 0);
        const valid = battle.placingRecruit && !h && row >= 1;
        return `<button class="cell ${valid ? "valid" : ""}" onclick="placeRecruit(${i})">
          ${e ? unitHtml(e, "enemy") : ""}
          ${h ? unitHtml(h, "hero") : ""}
        </button>`;
      }

      function unitHtml(u, kind) {
        const pct = Math.max(0, Math.round((u.hp / u.maxHp) * 100));
        return `<div class="unit ${kind}"><b>${kind === "hero" ? u.sigil : (u.boss ? "Chefe" : "Inimigo")}</b><small>${u.name}</small><div class="hp"><span style="width:${pct}%"></span></div></div>`;
      }

      function runBattle() {
        if (!battle || loop) return;
        battle.log = "A batalha comeÃ§ou. HerÃ³is atacam automaticamente.";
        loop = setInterval(stepBattle, state.settings.speed2 ? 260 : 520);
        renderBattle();
      }

      function stepBattle() {
        if (!battle || battle.paused) return;
        battle.tick += 1;
        if (battle.tick % 3 === 0 && battle.spawned < battle.stage.waves) spawnWave();
        battle.heroes.forEach(heroAct);
        battle.enemies.forEach(enemyAct);
        battle.heroes = battle.heroes.filter((u) => u.hp > 0);
        battle.enemies = battle.enemies.filter((u) => u.hp > 0 && u.row < 4);
        if (battle.camp <= 0 || battle.heroes.length === 0) return finishBattle(false);
        const bossDown = battle.stage.boss ? battle.spawned >= battle.stage.waves && !battle.enemies.some((e) => e.boss) : true;
        if (battle.spawned >= battle.stage.waves && battle.enemies.length === 0 && bossDown) return finishBattle(true);
        renderBattle();
      }

      function spawnWave() {
        battle.spawned += 1;
        battle.wave = battle.spawned;
        const isBoss = battle.stage.boss && battle.spawned === battle.stage.waves;
        const id = isBoss ? battle.stage.boss : battle.stage.enemies[Math.min(battle.stage.enemies.length - 1, (battle.spawned - 1) % battle.stage.enemies.length)];
        battle.enemies.push(makeEnemy(id, battle.spawned % 3));
        if (!isBoss && battle.stage.enemies.length > 2 && battle.spawned % 4 === 0) battle.enemies.push(makeEnemy(battle.stage.enemies[0], (battle.spawned + 1) % 3));
        battle.log = isBoss ? `${ENEMIES[id].name} entrou na arena. Avisos grandes marcam os golpes.` : `${ENEMIES[id].name} surgiu na coluna ${(battle.spawned % 3) + 1}.`;
      }

      function heroAct(u) {
        u.cd -= u.speed * battle.modifiers.speed;
        if (u.cd > 0) return;
        const targets = battle.enemies
          .filter((e) => Math.abs(e.col - u.col) <= (u.range > 1 ? 2 : 1))
          .sort((a, b) => b.row - a.row || a.hp - b.hp);
        const target = targets[0];
        if (!target) return;
        const damage = Math.round(u.atk * battle.modifiers.damage);
        target.hp -= damage;
        u.cd = 4;
        battle.log = `${u.name} causou ${damage} de dano em ${target.name}.`;
        if (target.hp <= 0) {
          battle.xp += target.xp;
          if (battle.xp >= 100) levelUp();
        }
      }

      function enemyAct(e) {
        e.cd -= e.speed;
        e.move += e.speed;
        const target = battle.heroes
          .filter((h) => h.col === e.col || Math.abs(h.col - e.col) <= (e.ranged ? 2 : 0))
          .sort((a, b) => b.row - a.row || a.hp - b.hp)[0];
        if (target && e.cd <= 0) {
          const damage = Math.max(1, Math.round(e.atk / battle.modifiers.defense));
          target.hp -= damage;
          e.cd = e.ranged ? 5 : 4;
          battle.log = `${e.name} causou ${damage} de dano em ${target.name}.`;
          return;
        }
        if (e.move >= 3) {
          e.move = 0;
          e.row += 1;
          if (e.row > 3) {
            battle.camp -= e.boss ? 28 : 10;
            e.hp = 0;
            battle.log = `${e.name} atingiu a Integridade do Acampamento.`;
          }
        }
      }

      function levelUp() {
        battle.xp = 0;
        battle.level += 1;
        battle.paused = true;
        clearInterval(loop);
        loop = null;
        const choices = buildCardChoices();
        battle.currentCards = choices;
        state.missions.cards += 1;
        save();
        showModal("Escolha uma melhoria", `<p class="small">A batalha pausa e exatamente trÃªs cartas vÃ¡lidas aparecem.</p><div class="card-choice">${choices.map((c, i) => `<button class="choice-card" onclick="chooseCard(${i})"><span class="meta">${c.type}</span><h3>${c.title}</h3><p>${c.text}</p></button>`).join("")}</div>`, true);
      }

      function buildCardChoices() {
        const unrecruited = state.formation.filter((id) => id && !battle.recruited.includes(id));
        const choices = [];
        if (unrecruited.length && battle.level <= 3) {
          const id = unrecruited[0];
          choices.push({ type: "Recrutamento", title: `Recrutar ${hero(id).name}`, text: "Toque em uma cÃ©lula livre para colocar este herÃ³i em campo.", recruit: id });
        }
        const pool = [
          { type: "Universal", title: "Dano coordenado I", text: "+20% de dano da equipe nesta partida.", apply: () => battle.modifiers.damage += 0.2 },
          { type: "Universal", title: "Ritmo de batalha I", text: "+15% de velocidade de ataque da equipe.", apply: () => battle.modifiers.speed += 0.15 },
          { type: "Universal", title: "Linha protegida I", text: "+20% de defesa para todos os herÃ³is.", apply: () => battle.modifiers.defense += 0.2 },
          { type: "Universal", title: "ProvisÃµes de campo I", text: "Todos os herÃ³is recuperam 25 de vida agora.", apply: () => battle.heroes.forEach((h) => h.hp = Math.min(h.maxHp, h.hp + 25)) },
        ];
        battle.recruited.forEach((id) => {
          const h = hero(id);
          pool.push({ type: h.name, title: `${h.cards[0]} I`, text: `${h.name} recebe +25% de dano nesta partida.`, apply: () => battle.heroes.filter((u) => u.id === id).forEach((u) => u.atk = Math.round(u.atk * 1.25)) });
        });
        while (choices.length < 3 && pool.length) {
          const pick = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
          choices.push(pick);
        }
        return choices.slice(0, 3);
      }

      function chooseCard(index) {
        const card = battle.currentCards[index];
        closeModal();
        if (card.recruit) {
          battle.placingRecruit = card.recruit;
          battle.paused = true;
          battle.log = `Escolha uma cÃ©lula livre para recrutar ${hero(card.recruit).name}.`;
          renderBattle();
          return;
        }
        card.apply();
        battle.paused = false;
        battle.log = `${card.title} aplicada.`;
        runBattle();
      }

      function placeRecruit(cell) {
        if (!battle?.placingRecruit) return;
        const row = Math.floor(cell / 3), col = cell % 3;
        if (battle.heroes.some((h) => h.row === row && h.col === col) || row < 1) return toast("Escolha uma cÃ©lula livre da zona de herÃ³is.");
        const h = hero(battle.placingRecruit);
        battle.heroes.push(makeBattleHero(h, cell));
        battle.recruited.push(h.id);
        battle.placingRecruit = null;
        battle.paused = false;
        battle.log = `${h.name} entrou em campo.`;
        runBattle();
      }

      function finishBattle(win) {
        clearInterval(loop);
        loop = null;
        const { stage } = battle;
        if (win) {
          state.coins += stage.reward.coins || 0;
          state.fragments += stage.reward.fragments || 0;
          state.tickets += stage.reward.tickets || 0;
          state.energy += stage.reward.energy || 0;
          state.accountXp += 80;
          state.missions.battles += 1;
          if (stage.reward.unlockBook && !state.unlockedBooks.includes(stage.reward.unlockBook)) state.unlockedBooks.push(stage.reward.unlockBook);
          if (stage.reward.fifthSlot && state.formation.length < 5) state.formation.push(null);
          state.completed[`${battle.book.id}-${stage.id}`] = true;
          if (state.accountXp >= state.accountLevel * 120) {
            state.accountXp = 0;
            state.accountLevel += 1;
          }
        }
        save();
        const reward = win ? `+${stage.reward.coins || 0} moedas, +${stage.reward.fragments || 0} fragmentos${stage.reward.tickets ? `, +${stage.reward.tickets} bilhete(s)` : ""}` : "Nenhuma recompensa. Ajuste a formaÃ§Ã£o e tente novamente.";
        $("battle").classList.add("hidden");
        showModal(win ? "VitÃ³ria" : "Derrota", `<p>${win ? "A arena foi concluÃ­da com sucesso." : "A Integridade do Acampamento chegou a zero ou todos os herÃ³is caÃ­ram."}</p><article class="reward-card"><h3>${reward}</h3></article><button class="btn full" onclick="closeModal()">Voltar</button>`);
        battle = null;
        render();
      }

      function toggleSpeed() {
        state.settings.speed2 = !state.settings.speed2;
        save();
        if (loop) {
          clearInterval(loop);
          loop = null;
          runBattle();
        }
        toast(state.settings.speed2 ? "Velocidade 2x ativa." : "Velocidade normal.");
      }

      function quitBattle() {
        clearInterval(loop);
        loop = null;
        battle = null;
        $("battle").classList.add("hidden");
        render();
      }

      function showModal(title, body, locked = false) {
        $("modal").innerHTML = `<section class="modal-card"><div class="panel-head"><div><span class="eyebrow">HerÃ³i Ortodoxo</span><h2>${title}</h2></div>${locked ? "" : '<button class="btn ghost" onclick="closeModal()">Fechar</button>'}</div>${body}</section>`;
        $("modal").classList.remove("hidden");
      }

      function closeModal() {
        $("modal").classList.add("hidden");
      }

      document.querySelectorAll(".nav button").forEach((button) => button.addEventListener("click", () => switchView(button.dataset.view)));
      render();
    </script>
  </body>
</html>
