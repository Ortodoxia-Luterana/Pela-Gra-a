<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Match 3 Luterano | Ortodoxia Luterana Gaming</title>
  <style>
    :root {
      --gold: #d59a2b;
      --gold-2: #ffe08a;
      --ink: #2a1d14;
      --paper: #efe1b8;
      --panel: rgba(16, 27, 36, .92);
      --cell: rgba(38, 65, 78, .88);
      --line: rgba(255, 224, 138, .42);
      --text: #fff3d6;
      --muted: #d8c9aa;
      --danger: #c7433d;
      --ok: #6fd16f;
      --tile: calc((min(94vw, 520px) - 18px) / 8);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(4, 9, 14, .1), rgba(4, 9, 14, .5)),
        url("/assets/match3-bg.svg") center / cover no-repeat,
        #08111a;
      overflow-x: hidden;
    }

    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .app {
      width: min(100%, 560px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }

    .top {
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      gap: 8px;
    }

    .seal, .icon-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: rgba(20, 18, 30, .82);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .28);
    }

    .seal img { width: 44px; height: 44px; }
    .icon-btn { color: var(--gold-2); cursor: pointer; }

    .title {
      min-width: 0;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(7, 15, 22, .76);
      padding: 8px 10px;
    }

    .title span {
      display: block;
      color: var(--gold-2);
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.05;
    }

    .title small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hud article, .objectives, .boosters, .board-wrap, .message {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(255, 246, 214, .95), rgba(231, 207, 153, .94));
      color: var(--ink);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .24);
    }

    .hud article {
      min-height: 58px;
      padding: 8px 7px;
      text-align: center;
    }

    .hud span {
      display: block;
      color: #73501d;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hud strong { display: block; font-family: Georgia, serif; font-size: 25px; line-height: 1.05; }

    .objectives {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 7px;
    }

    .objective {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 5px;
      align-items: center;
      min-height: 44px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .32);
      padding: 4px 6px;
    }

    .objective img { width: 34px; height: 34px; object-fit: contain; }
    .objective b { display: block; font-size: 16px; }
    .objective small { display: block; color: #73501d; font-size: 10px; text-transform: uppercase; font-weight: 800; }

    .board-wrap {
      align-self: start;
      padding: 8px;
      background: linear-gradient(180deg, rgba(18, 48, 61, .98), rgba(9, 29, 41, .98));
      border-width: 2px;
    }

    .board {
      width: min(94vw, 520px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      touch-action: none;
    }

    .cell {
      position: relative;
      border: 0;
      border-radius: 8px;
      background:
        radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .12), transparent 42%),
        var(--cell);
      padding: 2px;
      cursor: pointer;
      overflow: hidden;
    }

    .cell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
      pointer-events: none;
    }

    .cell.selected {
      outline: 3px solid var(--gold-2);
      z-index: 2;
      transform: scale(.96);
    }

    .cell.matched {
      animation: pop .24s ease both;
    }

    .piece {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 4px rgba(0, 0, 0, .34));
      pointer-events: none;
    }

    .boosters {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      padding: 8px;
    }

    .booster, .restart {
      min-height: 58px;
      border: 1px solid rgba(115, 80, 29, .24);
      border-radius: 9px;
      color: var(--ink);
      background: rgba(255, 255, 255, .36);
      display: grid;
      grid-template-columns: 40px 1fr;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      cursor: pointer;
    }

    .booster.active { outline: 3px solid var(--gold); }
    .booster img { width: 38px; height: 38px; }
    .booster strong { display: block; font-size: 13px; }
    .booster span { display: block; color: #73501d; font-size: 12px; font-weight: 800; }

    .restart {
      grid-template-columns: 1fr;
      min-width: 54px;
      text-align: center;
      font-size: 22px;
      color: #703226;
    }

    .message {
      min-height: 40px;
      padding: 9px 12px;
      color: var(--ink);
      text-align: center;
      font-weight: 800;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(4, 9, 14, .68);
      z-index: 10;
    }

    .overlay.show { display: grid; }

    .modal {
      width: min(100%, 420px);
      border: 2px solid var(--gold);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff5d7, #e5c985);
      color: var(--ink);
      padding: 20px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
    }

    .modal h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 28px; }
    .modal p { margin: 0 0 16px; line-height: 1.45; }
    .modal button, .modal a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid #8a5c1f;
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      color: #22160a;
      font-weight: 900;
      padding: 10px 14px;
      margin: 4px;
      cursor: pointer;
    }

    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(.2); opacity: 0; }
    }

    @media (min-width: 760px) {
      .app {
        width: min(100%, 1180px);
        grid-template-columns: 220px minmax(420px, 560px) 220px;
        grid-template-rows: auto 1fr auto;
        align-items: start;
      }
      .top { grid-column: 1 / -1; }
      .hud, .objectives { grid-column: 1; }
      .objectives { grid-template-columns: 1fr; }
      .board-wrap { grid-column: 2; grid-row: 2 / span 2; }
      .boosters, .message { grid-column: 3; }
      .boosters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="seal" href="/" aria-label="Voltar ao hub"><img src="/assets/match3-tile-rose.svg" alt=""></a>
      <div class="title"><span>Match 3 Luterano</span><small>Soli Deo Gloria</small></div>
      <button class="icon-btn" id="sound" type="button" aria-label="Som">♪</button>
    </header>

    <section class="hud" aria-label="Status da fase">
      <article><span>Nível</span><strong id="level">1</strong></article>
      <article><span>Movimentos</span><strong id="moves">25</strong></article>
      <article><span>Pontos</span><strong id="score">0</strong></article>
    </section>

    <section class="objectives" id="objectives" aria-label="Objetivos"></section>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="Tabuleiro Match 3"></div>
    </section>

    <section class="boosters" aria-label="Ferramentas">
      <button class="booster" id="hammer" type="button"><img src="/assets/match3-booster-hammer.svg" alt=""><span><strong>Martelo</strong><span id="hammer-count">3</span></span></button>
      <button class="booster" id="shuffle" type="button"><img src="/assets/match3-booster-shuffle.svg" alt=""><span><strong>Embaralhar</strong><span id="shuffle-count">2</span></span></button>
      <button class="restart" id="restart" type="button" aria-label="Reiniciar">↻</button>
    </section>

    <div class="message" id="message">Toque em uma peça e depois em uma vizinha para combinar.</div>
  </main>

  <div class="overlay" id="overlay">
    <section class="modal">
      <h2 id="modal-title">Fase concluída</h2>
      <p id="modal-copy"></p>
      <button type="button" id="next-level">Continuar</button>
      <a href="/">Hub</a>
    </section>
  </div>

  <script>
    const KEY = "ol-match3-luterano-v1";
    const SIZE = 8;
    const TYPES = [
      { id: "book", name: "Livro", src: "/assets/match3-tile-book.svg" },
      { id: "rose", name: "Rosa", src: "/assets/match3-tile-rose.svg" },
      { id: "candle", name: "Vela", src: "/assets/match3-tile-candle.svg" },
      { id: "chalice", name: "Cálice", src: "/assets/match3-tile-chalice.svg" },
      { id: "heart", name: "Coração", src: "/assets/match3-tile-heart.svg" },
      { id: "fish", name: "Peixe", src: "/assets/match3-tile-fish.svg" }
    ];
    const OBJECTIVE_IDS = ["book", "rose", "candle"];
    const baseState = () => ({
      level: 1,
      moves: 25,
      score: 0,
      board: [],
      goals: { book: 12, rose: 8, candle: 10 },
      collected: { book: 0, rose: 0, candle: 0 },
      boosters: { hammer: 3, shuffle: 2 },
      selected: null,
      mode: null,
      over: false
    });

    let state = loadState();
    const boardEl = document.querySelector("#board");
    const messageEl = document.querySelector("#message");
    const overlay = document.querySelector("#overlay");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || "null");
        if (saved && Array.isArray(saved.board) && saved.board.length === SIZE * SIZE) return saved;
      } catch {}
      const fresh = baseState();
      fresh.board = makeBoard();
      return fresh;
    }

    function saveState() {
      localStorage.setItem(KEY, JSON.stringify({ ...state, selected: null, mode: null }));
    }

    function randType() {
      return TYPES[Math.floor(Math.random() * TYPES.length)].id;
    }

    function makeBoard() {
      const b = [];
      for (let i = 0; i < SIZE * SIZE; i += 1) {
        let type = randType();
        while (wouldMatchAt(b, i, type)) type = randType();
        b[i] = type;
      }
      return b;
    }

    function wouldMatchAt(board, index, type) {
      const row = Math.floor(index / SIZE);
      const col = index % SIZE;
      return (col >= 2 && board[index - 1] === type && board[index - 2] === type) ||
        (row >= 2 && board[index - SIZE] === type && board[index - SIZE * 2] === type);
    }

    function render() {
      document.querySelector("#level").textContent = state.level;
      document.querySelector("#moves").textContent = state.moves;
      document.querySelector("#score").textContent = state.score;
      document.querySelector("#hammer-count").textContent = state.boosters.hammer;
      document.querySelector("#shuffle-count").textContent = state.boosters.shuffle;
      document.querySelector("#hammer").classList.toggle("active", state.mode === "hammer");
      document.querySelector("#shuffle").classList.toggle("active", state.mode === "shuffle");
      document.querySelector("#objectives").innerHTML = OBJECTIVE_IDS.map(id => {
        const type = TYPES.find(item => item.id === id);
        const done = Math.min(state.collected[id] || 0, state.goals[id]);
        return `<article class="objective"><img src="${type.src}" alt=""><span><small>${type.name}</small><b>${done}/${state.goals[id]}</b></span></article>`;
      }).join("");
      boardEl.innerHTML = state.board.map((id, index) => {
        const type = TYPES.find(item => item.id === id);
        const selected = state.selected === index ? " selected" : "";
        return `<button class="cell${selected}" type="button" data-index="${index}" aria-label="${type.name}"><img class="piece" src="${type.src}" alt=""></button>`;
      }).join("");
    }

    function adjacent(a, b) {
      const ar = Math.floor(a / SIZE), ac = a % SIZE;
      const br = Math.floor(b / SIZE), bc = b % SIZE;
      return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
    }

    function swap(a, b) {
      [state.board[a], state.board[b]] = [state.board[b], state.board[a]];
    }

    async function select(index) {
      if (state.over) return;
      if (state.mode === "hammer") {
        if (state.boosters.hammer <= 0) return;
        state.boosters.hammer -= 1;
        removeCells([index], true);
        state.mode = null;
        state.moves -= 1;
        await settle();
        afterMove();
        return;
      }
      if (state.selected === null) {
        state.selected = index;
        message("Escolha uma peça vizinha.");
        render();
        return;
      }
      if (state.selected === index) {
        state.selected = null;
        render();
        return;
      }
      if (!adjacent(state.selected, index)) {
        state.selected = index;
        message("Agora toque em uma peça vizinha.");
        render();
        return;
      }
      const first = state.selected;
      state.selected = null;
      swap(first, index);
      const matches = findMatches();
      if (!matches.length) {
        swap(first, index);
        message("Sem combinação. Tente outro movimento.");
        render();
        return;
      }
      state.moves -= 1;
      await resolveMatches(matches);
      afterMove();
    }

    function findMatches() {
      const found = new Set();
      for (let r = 0; r < SIZE; r += 1) {
        let run = [r * SIZE];
        for (let c = 1; c < SIZE; c += 1) {
          const i = r * SIZE + c;
          if (state.board[i] && state.board[i] === state.board[run[0]]) run.push(i);
          else {
            if (run.length >= 3) run.forEach(x => found.add(x));
            run = [i];
          }
        }
        if (run.length >= 3) run.forEach(x => found.add(x));
      }
      for (let c = 0; c < SIZE; c += 1) {
        let run = [c];
        for (let r = 1; r < SIZE; r += 1) {
          const i = r * SIZE + c;
          if (state.board[i] && state.board[i] === state.board[run[0]]) run.push(i);
          else {
            if (run.length >= 3) run.forEach(x => found.add(x));
            run = [i];
          }
        }
        if (run.length >= 3) run.forEach(x => found.add(x));
      }
      return [...found];
    }

    function removeCells(cells, hammer = false) {
      cells.forEach(index => {
        const id = state.board[index];
        if (OBJECTIVE_IDS.includes(id)) state.collected[id] = (state.collected[id] || 0) + 1;
        state.board[index] = null;
      });
      state.score += cells.length * (hammer ? 25 : 40);
    }

    async function resolveMatches(initial) {
      let matches = initial;
      let chain = 0;
      while (matches.length) {
        chain += 1;
        mark(matches);
        await wait(150);
        removeCells(matches);
        drop();
        fill();
        render();
        await wait(90);
        matches = findMatches();
      }
      message(chain > 1 ? `Combo x${chain}.` : "Boa combinação.");
    }

    async function settle() {
      drop();
      fill();
      render();
      await wait(90);
      const matches = findMatches();
      if (matches.length) await resolveMatches(matches);
    }

    function mark(matches) {
      matches.forEach(index => {
        const el = boardEl.querySelector(`[data-index="${index}"]`);
        if (el) el.classList.add("matched");
      });
    }

    function drop() {
      for (let c = 0; c < SIZE; c += 1) {
        const stack = [];
        for (let r = SIZE - 1; r >= 0; r -= 1) {
          const value = state.board[r * SIZE + c];
          if (value) stack.push(value);
        }
        for (let r = SIZE - 1; r >= 0; r -= 1) {
          state.board[r * SIZE + c] = stack.shift() || null;
        }
      }
    }

    function fill() {
      for (let i = 0; i < state.board.length; i += 1) {
        if (!state.board[i]) state.board[i] = randType();
      }
    }

    function goalsDone() {
      return OBJECTIVE_IDS.every(id => (state.collected[id] || 0) >= state.goals[id]);
    }

    function afterMove() {
      state.selected = null;
      if (goalsDone()) return finish(true);
      if (state.moves <= 0) return finish(false);
      saveState();
      render();
    }

    function finish(win) {
      state.over = true;
      saveState();
      document.querySelector("#modal-title").textContent = win ? "Fase concluída" : "Sem movimentos";
      document.querySelector("#modal-copy").textContent = win
        ? `Nível ${state.level} vencido com ${state.score} pontos.`
        : "Os objetivos não foram concluídos. Reinicie a fase e tente outro caminho.";
      document.querySelector("#next-level").textContent = win ? "Próximo nível" : "Tentar de novo";
      overlay.classList.add("show");
      render();
    }

    function nextLevel() {
      const next = baseState();
      next.level = state.over && goalsDone() ? state.level + 1 : state.level;
      next.moves = Math.max(18, 25 - Math.floor((next.level - 1) / 2));
      next.score = goalsDone() ? state.score : 0;
      next.goals = {
        book: 12 + next.level * 2,
        rose: 8 + next.level,
        candle: 10 + next.level
      };
      next.boosters = {
        hammer: Math.max(1, 3 - Math.floor(next.level / 4)),
        shuffle: 2
      };
      next.board = makeBoard();
      state = next;
      overlay.classList.remove("show");
      saveState();
      message("Nova fase carregada.");
      render();
    }

    function restart() {
      localStorage.removeItem(KEY);
      state = baseState();
      state.board = makeBoard();
      overlay.classList.remove("show");
      message("Fase reiniciada.");
      saveState();
      render();
    }

    function message(text) {
      messageEl.textContent = text;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    boardEl.addEventListener("click", event => {
      const cell = event.target.closest("[data-index]");
      if (cell) select(Number(cell.dataset.index));
    });

    document.querySelector("#hammer").addEventListener("click", () => {
      if (state.boosters.hammer <= 0 || state.over) return;
      state.mode = state.mode === "hammer" ? null : "hammer";
      state.selected = null;
      message(state.mode ? "Martelo ativo: toque em uma peça para remover." : "Martelo cancelado.");
      render();
    });

    document.querySelector("#shuffle").addEventListener("click", async () => {
      if (state.boosters.shuffle <= 0 || state.over) return;
      state.boosters.shuffle -= 1;
      state.moves -= 1;
      state.board = state.board.sort(() => Math.random() - .5);
      state.mode = null;
      await settle();
      afterMove();
    });

    document.querySelector("#restart").addEventListener("click", restart);
    document.querySelector("#next-level").addEventListener("click", nextLevel);
    document.querySelector("#sound").addEventListener("click", () => message("Som reservado para a próxima etapa."));

    render();
    saveState();
  </script>
</body>
</html>
