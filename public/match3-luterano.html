<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luther Metch | Ortodoxia Luterana Gaming</title>
  <style>
    :root {
      --gold: #d59a2b;
      --gold-2: #ffe08a;
      --ink: #2a1d14;
      --paper: #efe1b8;
      --panel: rgba(16, 27, 36, .92);
      --cell: rgba(38, 65, 78, .88);
      --line: rgba(255, 224, 138, .42);
      --text: #fff3d6;
      --muted: #d8c9aa;
      --danger: #c7433d;
      --ok: #6fd16f;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(4, 9, 14, .1), rgba(4, 9, 14, .5)),
        url("/assets/luther-metch-bg.png") center top / cover no-repeat,
        #08111a;
      overflow-x: hidden;
    }

    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .app {
      width: min(100%, 390px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 10px;
      overflow-x: hidden;
    }

    .top {
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      gap: 8px;
    }

    .seal, .icon-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: rgba(20, 18, 30, .82);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .28);
    }

    .seal img { width: 44px; height: 44px; }
    .icon-btn {
      color: var(--gold-2);
      cursor: pointer;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .title {
      min-width: 0;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(7, 15, 22, .76);
      padding: 8px 10px;
    }

    .title span {
      display: block;
      color: var(--gold-2);
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.05;
    }

    .title small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hud article, .objectives, .board-wrap, .message {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(255, 246, 214, .95), rgba(231, 207, 153, .94));
      color: var(--ink);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .24);
    }

    .hud article {
      min-height: 58px;
      padding: 8px 7px;
      text-align: center;
    }

    .hud span {
      display: block;
      color: #73501d;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hud strong {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: Georgia, serif;
      font-size: clamp(21px, 7vw, 30px);
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    #score { font-size: clamp(18px, 5.4vw, 27px); }

    .level-map {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(7, 15, 22, .76);
      box-shadow: 0 12px 26px rgba(0, 0, 0, .22);
    }

    .map-node {
      min-height: 34px;
      border: 1px solid rgba(255, 224, 138, .32);
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 900;
      font-size: 12px;
      background: rgba(255, 255, 255, .06);
      position: relative;
    }

    .map-node.done {
      color: #171007;
      background: linear-gradient(180deg, #ffe08a, #d59a2b);
    }

    .map-node.current {
      color: #fff7d8;
      border-color: var(--gold-2);
      box-shadow: 0 0 0 2px rgba(255, 224, 138, .22), 0 0 22px rgba(213, 154, 43, .42);
    }

    .map-node.chest::after {
      content: "B";
      position: absolute;
      right: 4px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #6f3f08;
      color: var(--gold-2);
      font-size: 9px;
      font-weight: 1000;
    }

    .objectives {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 6px;
      padding: 7px;
    }

    .objective {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 5px;
      align-items: center;
      min-height: 44px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .32);
      padding: 4px 6px;
    }

    .objective img { width: 34px; height: 34px; object-fit: contain; }
    .objective b { display: block; font-size: 16px; }
    .objective small { display: block; color: #73501d; font-size: 10px; text-transform: uppercase; font-weight: 800; }

    .board-wrap {
      position: relative;
      align-self: start;
      width: 100%;
      max-width: 536px;
      margin: 0 auto;
      padding: 8px;
      background: linear-gradient(180deg, rgba(18, 48, 61, .98), rgba(9, 29, 41, .98));
      border-width: 2px;
    }

    .board {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      touch-action: none;
    }

    .combo-burst {
      position: absolute;
      left: 50%;
      top: 50%;
      display: none;
      transform: translate(-50%, -50%) scale(.86);
      color: #fff7ca;
      font-family: Georgia, serif;
      font-size: clamp(38px, 12vw, 72px);
      font-weight: 900;
      line-height: .9;
      text-align: center;
      text-shadow:
        0 2px 0 #6f3f08,
        0 0 10px rgba(255, 224, 138, .95),
        0 0 28px rgba(213, 154, 43, .9),
        0 10px 20px rgba(0, 0, 0, .55);
      z-index: 8;
      pointer-events: none;
      letter-spacing: 0;
    }

    .combo-burst.show {
      display: block;
      animation: combo-burst .76s cubic-bezier(.18, .9, .22, 1) both;
    }

    .combo-burst small {
      display: block;
      color: var(--gold-2);
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      font-size: clamp(13px, 3vw, 18px);
      font-weight: 1000;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .cell {
      position: relative;
      border: 0;
      border-radius: 8px;
      background:
        radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .12), transparent 42%),
        var(--cell);
      padding: 2px;
      cursor: pointer;
      overflow: hidden;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .cell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
      pointer-events: none;
    }

    .cell.selected {
      outline: 3px solid var(--gold-2);
      z-index: 2;
      transform: scale(.96);
    }

    .cell.matched {
      animation: pop .48s ease both;
      z-index: 3;
    }

    .cell.swap-from { animation: nudge-from .34s ease both; }
    .cell.swap-to { animation: nudge-to .34s ease both; }
    .cell.special-hit { animation: special-hit .68s ease both; }
    .cell.explosion {
      animation: explosion .76s ease both;
      box-shadow: 0 0 0 2px rgba(255, 224, 138, .8), 0 0 22px rgba(255, 197, 65, .74);
    }

    .cell.created {
      animation: created .78s ease both;
      box-shadow: 0 0 0 2px rgba(255, 224, 138, .86), 0 0 24px rgba(255, 224, 138, .72);
    }

    .cell.glass::before,
    .cell.chain::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 7px;
      z-index: 2;
      pointer-events: none;
    }

    .cell.glass::before {
      border: 2px solid rgba(180, 236, 255, .72);
      background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(91,169,217,.2));
      box-shadow: inset 0 0 10px rgba(255,255,255,.28);
    }

    .cell.glass-2::before {
      border-width: 3px;
      background: linear-gradient(135deg, rgba(255,255,255,.48), rgba(91,169,217,.32));
    }

    .cell.chain::before {
      border: 3px solid rgba(105, 76, 43, .84);
      background:
        linear-gradient(45deg, transparent 38%, rgba(255, 224, 138, .75) 42%, rgba(255, 224, 138, .75) 58%, transparent 62%),
        linear-gradient(-45deg, transparent 38%, rgba(255, 224, 138, .75) 42%, rgba(255, 224, 138, .75) 58%, transparent 62%);
    }

    .cell.dragging {
      z-index: 4;
      box-shadow: 0 12px 26px rgba(0, 0, 0, .44);
    }

    .cell.dragging .piece {
      transform: translate(var(--drag-x, 0px), var(--drag-y, 0px)) scale(1.06);
    }

    .piece {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 4px rgba(0, 0, 0, .34));
      pointer-events: none;
      transition: transform .12s ease;
    }

    .piece.special {
      transform: scale(1.08);
      filter:
        drop-shadow(0 0 8px rgba(255, 224, 138, .8))
        drop-shadow(0 7px 5px rgba(0, 0, 0, .38));
    }

    .message {
      min-height: 40px;
      padding: 9px 12px;
      color: var(--ink);
      text-align: center;
      font-weight: 800;
    }

    .level-complete {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(4, 8, 12, .58);
      z-index: 20;
      pointer-events: none;
    }

    .level-complete.show {
      display: grid;
      animation: overlay-fade .22s ease both;
    }

    .level-card {
      width: min(100%, 360px);
      border: 2px solid rgba(255, 224, 138, .82);
      border-radius: 16px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 224, 138, .28), transparent 45%),
        linear-gradient(180deg, rgba(22, 17, 28, .98), rgba(8, 12, 18, .98));
      color: #fff7d8;
      text-align: center;
      padding: 24px 18px 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .62);
      animation: level-card-in .42s cubic-bezier(.18, .9, .22, 1) .08s both;
    }

    .level-card small {
      display: block;
      color: var(--gold-2);
      font-size: 12px;
      font-weight: 1000;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .level-card strong {
      display: block;
      margin-top: 8px;
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1.08;
    }

    .level-card span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-weight: 800;
    }

    .achievement-toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(calc(100vw - 24px), 380px);
      display: none;
      grid-template-columns: 58px 1fr;
      gap: 10px;
      align-items: center;
      transform: translate(-50%, 18px);
      border: 1px solid rgba(255, 224, 138, .72);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(18, 24, 34, .96), rgba(8, 12, 18, .96));
      color: var(--text);
      padding: 10px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .46);
      opacity: 0;
      z-index: 20;
      pointer-events: none;
    }

    .achievement-toast.show {
      display: grid;
      animation: medal-toast 3.4s ease both;
    }

    .achievement-toast img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .4));
    }

    .achievement-toast small {
      display: block;
      color: var(--gold-2);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .achievement-toast strong {
      display: block;
      font-family: Georgia, serif;
      font-size: 17px;
      line-height: 1.15;
    }

    .achievement-toast span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      margin-top: 2px;
    }

    @keyframes pop {
      0% { transform: scale(1); opacity: 1; filter: brightness(1); }
      45% { transform: scale(1.12); opacity: 1; filter: brightness(1.4); }
      100% { transform: scale(.18); opacity: 0; filter: brightness(1.8); }
    }

    @keyframes nudge-from {
      0% { transform: scale(1); }
      45% { transform: translate(var(--swap-x, 0px), var(--swap-y, 0px)) scale(1.04); }
      100% { transform: scale(1); }
    }

    @keyframes nudge-to {
      0% { transform: scale(1); }
      45% { transform: translate(calc(var(--swap-x, 0px) * -1), calc(var(--swap-y, 0px) * -1)) scale(1.04); }
      100% { transform: scale(1); }
    }

    @keyframes special-hit {
      0% { transform: scale(1); filter: brightness(1); }
      35% { transform: scale(1.18); filter: brightness(1.8); }
      100% { transform: scale(.15) rotate(16deg); opacity: 0; filter: brightness(2); }
    }

    @keyframes explosion {
      0% { transform: scale(.92); opacity: 1; filter: brightness(1); }
      38% { transform: scale(1.16); opacity: 1; filter: brightness(2); }
      100% { transform: scale(.08); opacity: 0; filter: brightness(2.4); }
    }

    @keyframes created {
      0% { transform: scale(.2) rotate(-8deg); opacity: .2; filter: brightness(2); }
      55% { transform: scale(1.2); opacity: 1; filter: brightness(1.7); }
      100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }

    @keyframes medal-toast {
      0% { opacity: 0; transform: translate(-50%, 18px) scale(.96); }
      12% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      86% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, 14px) scale(.98); }
    }

    @keyframes combo-burst {
      0% { opacity: 0; transform: translate(-50%, -44%) scale(.62) rotate(-4deg); filter: brightness(1.8); }
      28% { opacity: 1; transform: translate(-50%, -54%) scale(1.14) rotate(1deg); filter: brightness(1.25); }
      68% { opacity: 1; transform: translate(-50%, -60%) scale(1); filter: brightness(1); }
      100% { opacity: 0; transform: translate(-50%, -74%) scale(.94) rotate(2deg); filter: brightness(1.3); }
    }

    @media (min-width: 760px) {
      .app {
        width: min(100%, 1180px);
        grid-template-columns: 220px minmax(420px, 560px) 220px;
        grid-template-rows: auto 1fr auto;
        align-items: start;
      }
      .top { grid-column: 1 / -1; }
      .hud, .objectives { grid-column: 1; }
      .hud { grid-template-columns: 1fr; }
      .hud article { min-height: 74px; padding: 11px 10px; }
      .hud strong { font-size: 34px; }
      #score { font-size: 27px; }
      .objectives { grid-template-columns: 1fr; }
      .board-wrap { grid-column: 2; grid-row: 2 / span 2; }
      .message { grid-column: 3; }
    }

    @keyframes overlay-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes level-card-in {
      from { opacity: 0; transform: translateY(18px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="seal" href="/" aria-label="Voltar ao hub"><img src="/assets/match3-tile-rose.svg" alt=""></a>
      <div class="title"><span>Luther Metch</span><small>Soli Deo Gloria</small></div>
      <button class="icon-btn" id="sound" type="button" aria-label="Som"><span aria-hidden="true">&#9835;</span></button>
    </header>

    <section class="hud" aria-label="Status da fase">
      <article><span>Nivel</span><strong id="level">1</strong></article>
      <article><span>Movimentos</span><strong id="moves">25</strong></article>
      <article><span>Pontos</span><strong id="score">0</strong></article>
    </section>

    <section class="level-map" id="level-map" aria-label="Mapa de progresso"></section>

    <section class="objectives" id="objectives" aria-label="Objetivos"></section>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="Tabuleiro Match 3"></div>
      <div class="combo-burst" id="combo-burst" aria-live="polite"></div>
    </section>

    <div class="message" id="message">Deslize uma peca para trocar com a vizinha.</div>
  </main>

  <div class="level-complete" id="level-complete" aria-live="polite">
    <div class="level-card">
      <small>Parabens</small>
      <strong id="level-complete-title">Voce passou pelo nivel 1</strong>
      <span id="level-complete-next">Indo para o proximo nivel...</span>
    </div>
  </div>

  <div class="achievement-toast" id="achievement-toast" aria-live="polite"></div>

  <script>
    const KEY = "ol-luther-metch-v2";
    const SIZE = 8;
    const MAX_LEVEL = 500;
    const PROGRESS_API = "/api/luther-metch/progress";
    const TYPES = [
      { id: "book", name: "Livro", src: "/assets/match3-tile-book.svg" },
      { id: "rose", name: "Rosa", src: "/assets/match3-tile-rose.svg" },
      { id: "candle", name: "Vela", src: "/assets/match3-tile-candle.svg" },
      { id: "chalice", name: "Calice", src: "/assets/match3-tile-chalice.svg" },
      { id: "heart", name: "Coracao", src: "/assets/match3-tile-heart.svg" },
      { id: "fish", name: "Peixe", src: "/assets/match3-tile-fish.svg" }
    ];
    const SPECIALS = {
      luther: { name: "Lutero", src: "/assets/match3-special-luther.png" },
      solas: { name: "Tres Solas", src: "/assets/match3-special-solas.png" }
    };
    const GOAL_META = {
      score: { name: "Pontos", icon: "*" },
      glass: { name: "Vitral", icon: "#" },
      chain: { name: "Corrente", icon: "C" }
    };
    const DEFAULT_OBJECTIVE_IDS = ["book", "rose", "candle"];
    const baseState = () => ({
      level: 1,
      bestLevel: 1,
      completedLevels: 0,
      moves: 25,
      score: 0,
      totalScore: 0,
      scoreMode: "level",
      board: [],
      goalIds: DEFAULT_OBJECTIVE_IDS,
      goals: { book: 12, rose: 8, candle: 10 },
      collected: { book: 0, rose: 0, candle: 0 },
      obstacles: [],
      scoreTarget: 0,
      phaseType: "collect",
      chestRewards: [],
      boosters: { hammer: 3, shuffle: 2 },
      maxCombo: 0,
      lutherPairUsed: false,
      solasPairUsed: false,
      selected: null,
      mode: null,
      over: false
    });

    let state = loadState();
    let pointerStart = null;
    let isBusy = false;
    const boardEl = document.querySelector("#board");
    const messageEl = document.querySelector("#message");
    const comboBurst = document.querySelector("#combo-burst");
    const levelComplete = document.querySelector("#level-complete");
    const levelCompleteTitle = document.querySelector("#level-complete-title");
    const levelCompleteNext = document.querySelector("#level-complete-next");
    const achievementToast = document.querySelector("#achievement-toast");

    function makeTile(type = randType(), special = null) { return { type, special }; }
    function tileType(tile) { return typeof tile === "string" ? tile : tile?.type; }
    function tileSpecial(tile) { return typeof tile === "object" ? tile?.special : null; }
    function matchType(tile) { return tileSpecial(tile) ? null : tileType(tile); }
    function normalizeBoard(board) { return board.map(tile => tile ? makeTile(tileType(tile), tileSpecial(tile)) : null); }
    function uniqueList(items) { return [...new Set(items)]; }
    function levelTypeIds(level) {
      const capped = Math.max(1, Math.min(MAX_LEVEL, Math.floor(Number(level) || 1)));
      const count = capped >= 30 ? 6 : capped >= 10 ? 5 : 4;
      return TYPES.slice(0, count).map(item => item.id);
    }

    function phaseTypeFor(level) {
      if (level % 10 === 0) return "mixed";
      if (level >= 18 && level % 6 === 0) return "chain";
      if (level >= 12 && level % 4 === 0) return "glass";
      if (level >= 8 && level % 5 === 0) return "score";
      return "collect";
    }

    function obstaclePlan(level, phase) {
      const capped = Math.max(1, Math.min(MAX_LEVEL, Math.floor(Number(level) || 1)));
      const glassCount = phase === "glass" || phase === "mixed" ? Math.min(32, 4 + Math.floor(capped / 10)) : 0;
      const chainCount = phase === "chain" || phase === "mixed" ? Math.min(24, 3 + Math.floor(capped / 16)) : 0;
      const doubleGlass = capped >= 120 ? Math.ceil(glassCount / 3) : 0;
      return {
        glassCount,
        chainCount,
        glassHits: glassCount + doubleGlass,
        chainHits: chainCount
      };
    }

    function levelConfig(level) {
      const capped = Math.max(1, Math.min(MAX_LEVEL, Math.floor(Number(level) || 1)));
      const tier = Math.floor((capped - 1) / 20);
      const activeTypes = levelTypeIds(capped);
      const phaseType = phaseTypeFor(capped);
      const objectiveCount = phaseType === "mixed" ? 2 : capped >= 120 ? 3 : 2;
      const offset = Math.floor((capped - 1) / 2) % activeTypes.length;
      const goalIds = uniqueList(Array.from({ length: objectiveCount + 1 }, (_, index) => activeTypes[(offset + index) % activeTypes.length])).slice(0, objectiveCount);
      const pressure = capped % 10 === 0 ? 2 : capped % 5 === 0 ? 1 : 0;
      const styleName = phaseType === "mixed" ? "Bau da Reforma" : phaseType === "chain" ? "Quebre correntes" : phaseType === "glass" ? "Quebre vitrais" : phaseType === "score" ? "Meta de pontos" : "Coleta rotativa";

    function randType(pool = null) {

    function mapLevels() {

    function render() {

    function adjacent(a, b) {

    async function tryMove(first, second) {

    function findMatchGroups() {

    async function commitSwap(first, second) {
      const from = boardEl.querySelector(`[data-index="${first}"]`);
      const to = boardEl.querySelector(`[data-index="${second}"]`);
      const fromRect = from?.getBoundingClientRect();
      const toRect = to?.getBoundingClientRect();

      swap(first, second);
      render();

      if (!fromRect || !toRect) {
        await wait(260);

      const movedToSecond = boardEl.querySelector(`[data-index="${second}"]`);
      const movedToFirst = boardEl.querySelector(`[data-index="${first}"]`);
      const dx = toRect.left - fromRect.left;
      const dy = toRect.top - fromRect.top;
      const animated = [
        [movedToSecond, -dx, -dy],
        [movedToFirst, dx, dy]
      ];

      animated.forEach(([el, x, y]) => {
        if (!el) return;
        el.style.transition = "none";
        el.style.transform = `translate(${x}px, ${y}px)`;
        el.style.zIndex = "4";

        el.style.transform = "";
        el.style.zIndex = "";

    function drop() {
      for (let c = 0; c < SIZE; c += 1) {

        for (let r = SIZE - 1; r >= 0; r -= 1) {

        for (let r = SIZE - 1; r >= 0; r -= 1) {

    }

    function fill() {
      for (let i = 0; i < state.board.length; i += 1) {
        if (!state.board[i]) state.board[i] = makeTile();
      }
    }

    function goalsDone() {
      const collectDone = (state.goalIds || DEFAULT_OBJECTIVE_IDS).every(id => (state.collected[id] || 0) >= state.goals[id]);
      const glassDone = !state.goals.glass || (state.collected.glass || 0) >= state.goals.glass;
      const chainDone = !state.goals.chain || (state.collected.chain || 0) >= state.goals.chain;
      const scoreDone = !state.goals.score || state.score >= state.goals.score;
      return collectDone && glassDone && chainDone && scoreDone;
    }

    function chestRewardFor(level) {
      if (level % 10 !== 0) return null;
      const chest = Math.floor(level / 10);
      return {
        level,
        points: 90 + Math.floor(chest / 5) * 25,
        xp: 120 + Math.floor(chest / 5) * 45
      };
    }

    function afterMove() {
      state.selected = null;
      if (goalsDone()) return finish(true);
      if (state.moves <= 0) return finish(false);
      saveState();
      render();
    }

    async function finish(win) {
      state.over = true;
      if (win) {
        state.completedLevels = Math.max(state.completedLevels || 0, state.level);
        state.bestLevel = Math.max(state.bestLevel || 1, Math.min(MAX_LEVEL, state.level + 1));
        const chest = chestRewardFor(state.level);
        if (chest) {
          state.chestRewards = uniqueList([...(state.chestRewards || []), state.level]);
        }
      }
      saveState();
      message(win
        ? state.level >= MAX_LEVEL ? "Campanha completa. Recarregando o nivel 500." : `Nivel ${state.level} concluido. Indo para o proximo...`
        : "Sem movimentos. Reiniciando a fase...");
      render();
      if (win) showLevelComplete(state.level, state.level >= MAX_LEVEL, chestRewardFor(state.level));
      await wait(win ? 2300 : 1100);
      hideLevelComplete();
      nextLevel();
    }

    function nextLevel() {
      const next = baseState();
      next.level = state.over && goalsDone() ? Math.min(MAX_LEVEL, state.level + 1) : state.level;
      next.bestLevel = Math.max(state.bestLevel || 1, next.level);
      next.completedLevels = Math.max(state.completedLevels || 0, Math.min(MAX_LEVEL, next.level - 1));
      next.score = 0;
      next.totalScore = Math.max(0, Math.floor(Number(state.totalScore) || 0));
      next.scoreMode = "level";
      const config = levelConfig(next.level);
      next.moves = config.moves;
      next.goalIds = config.goalIds;
      next.goals = config.goals;
      next.collected = Object.fromEntries(config.goalIds.map(id => [id, 0]));
      next.boosters = config.boosters;
      next.activeTypes = config.activeTypes;
      next.phaseType = config.phaseType;
      next.styleName = config.styleName;
      next.scoreTarget = config.scoreTarget;
      next.chestRewards = state.chestRewards || [];
      next.board = makeBoard(next.activeTypes);
      next.obstacles = makeObstacles(next);
      state = next;
      saveState();
      message(goalsDone() ? "Fase reiniciada." : `Nivel ${state.level}: ${state.styleName}.`);
      render();
    }

    function message(text) {
      messageEl.textContent = text;
    }

    function showLevelComplete(level, campaignDone = false, chest = null) {
      if (!levelComplete) return;
      levelCompleteTitle.textContent = campaignDone ? "Campanha completa" : "Voce passou pelo nivel " + level;
      levelCompleteNext.textContent = chest ? "Bau aberto: +" + chest.points + " pontos e +" + chest.xp + " XP." : campaignDone ? "Recarregando o nivel 500..." : "Indo para o proximo nivel...";
      levelComplete.classList.add("show");
    }

    function hideLevelComplete() {
      if (levelComplete) levelComplete.classList.remove("show");
    }

    function showComboBurst(multiplier) {
      if (!comboBurst) return;
      comboBurst.classList.remove("show");
      comboBurst.innerHTML = '<small>Combo</small>' + multiplier + 'x';
      comboBurst.offsetHeight;
      comboBurst.classList.add("show");
    }

    function showAchievement(medal) {
      if (!achievementToast || !medal) return;
      achievementToast.classList.remove("show");
      achievementToast.innerHTML =
        '<img src="' + medal.file + '" alt="">' +
        '<div><small>Medalha desbloqueada</small><strong>' + escapeText(medal.title) + '</strong><span>' + escapeText(medal.description || '') + '</span></div>';
      achievementToast.offsetHeight;
      achievementToast.classList.add("show");
    }

    function escapeText(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function nextFrame() {
      return new Promise(resolve => {
        if (typeof requestAnimationFrame === "function") requestAnimationFrame(resolve);
        else setTimeout(resolve, 16);
      });
    }

    boardEl.addEventListener("pointerdown", event => {
      if (isBusy || state.over) return;
      const cell = event.target.closest("[data-index]");
      if (!cell) return;
      event.preventDefault();
      pointerStart = {
        index: Number(cell.dataset.index),
        x: event.clientX,
        y: event.clientY,
        cell
      };
      cell.classList.add("dragging");
      cell.style.setProperty("--drag-x", "0px");
      cell.style.setProperty("--drag-y", "0px");
      boardEl.setPointerCapture?.(event.pointerId);
    });

    boardEl.addEventListener("pointermove", event => {
      if (!pointerStart) return;
      event.preventDefault();
      const dx = event.clientX - pointerStart.x;
      const dy = event.clientY - pointerStart.y;
      const limit = pointerStart.cell.getBoundingClientRect().width * .72;
      const clampedX = Math.max(-limit, Math.min(limit, dx));
      const clampedY = Math.max(-limit, Math.min(limit, dy));
      pointerStart.cell.style.setProperty("--drag-x", `${clampedX}px`);
      pointerStart.cell.style.setProperty("--drag-y", `${clampedY}px`);
    });

    boardEl.addEventListener("pointerup", event => {
      if (!pointerStart) return;
      event.preventDefault();
      const start = pointerStart;
      pointerStart = null;
      start.cell.classList.remove("dragging");
      start.cell.style.removeProperty("--drag-x");
      start.cell.style.removeProperty("--drag-y");
      const target = neighborFromSwipe(start.index, event.clientX - start.x, event.clientY - start.y);
      if (target !== null) tryMove(start.index, target);
      else select(start.index);
    });

    boardEl.addEventListener("pointercancel", () => {
      if (pointerStart?.cell) {
        pointerStart.cell.classList.remove("dragging");
        pointerStart.cell.style.removeProperty("--drag-x");
        pointerStart.cell.style.removeProperty("--drag-y");
      }
      pointerStart = null;
    });

    document.querySelector("#sound").addEventListener("click", () => message("Som reservado para a proxima etapa."));

    render();
    saveState();
    loadRemoteProgress();
  </script>
</body>
</html>
