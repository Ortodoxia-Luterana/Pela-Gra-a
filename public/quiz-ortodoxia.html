<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Ortodoxia | Ortodoxia Luterana Gaming</title>
  <style>
    :root{--gold:#f3c96b;--gold2:#c58a2d;--ink:#170f08;--text:#fff5de;--muted:#d7c8aa;--panel:rgba(11,13,17,.78);--line:rgba(243,201,107,.34);--ok:#79d687;--bad:#dd7068}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--text);font-family:Segoe UI,system-ui,Arial,sans-serif;background:#090907 url("/assets/quiz-ortodoxia-card.png") center/cover fixed}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 22%,rgba(243,201,107,.18),transparent 28%),linear-gradient(180deg,rgba(4,5,8,.55),rgba(4,5,8,.92) 60%,rgba(20,12,5,.96));pointer-events:none}.game{position:relative;min-height:100vh;max-width:1040px;margin:0 auto;padding:14px;display:grid;align-content:center;gap:12px}
    .hud{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,.ghost{border:1px solid var(--line);background:rgba(0,0,0,.38);color:var(--gold);border-radius:999px;text-decoration:none;font-weight:900;padding:10px 13px}.pill{border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.42);border-radius:999px;padding:9px 12px;color:var(--muted);font-size:13px}.brand{text-align:center}.brand h1{font-family:Georgia,serif;font-size:56px;line-height:.95;margin:2px 0;color:var(--gold);text-shadow:0 4px 24px rgba(0,0,0,.7)}.brand p{margin:0;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
    .stage{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(13,15,22,.86),rgba(8,9,13,.76));box-shadow:0 24px 80px rgba(0,0,0,.48);padding:18px;backdrop-filter:blur(8px)}.lobby{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.modes{display:grid;gap:12px}.mode{min-height:104px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.025));color:var(--text);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;cursor:pointer}.mode.active{border-color:var(--gold);background:linear-gradient(135deg,rgba(243,201,107,.22),rgba(255,255,255,.04))}.mode strong{display:block;font-family:Georgia,serif;color:var(--gold);font-size:27px}.mode span{color:var(--muted);line-height:1.35}.mode i{font-style:normal;font-size:30px;color:var(--gold)}
    .side{display:grid;gap:12px;align-content:start}.box{border:1px solid rgba(255,255,255,.11);background:rgba(4,5,8,.48);border-radius:14px;padding:13px}.label{margin:0 0 9px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.online{display:grid;gap:8px}.online-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);margin-right:7px}.btn{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06);color:var(--gold);padding:11px 13px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#ffe08a,#c78b26);color:#1d1208;border-color:#ffe69b}.btn.danger{color:#ffd8d4;border-color:rgba(221,112,104,.55)}.launch{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:12px}.status-title{font-weight:900;font-size:18px}.status-text{color:var(--muted);font-size:14px;margin-top:3px}.toast{min-height:42px;color:var(--muted)}
    .match{display:grid;gap:14px}.match-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.scoreline{display:flex;gap:8px;flex-wrap:wrap}.player{border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);border-radius:999px;padding:8px 11px;color:var(--muted);font-weight:800}.player.me{border-color:var(--gold);color:var(--text)}.player.done:after{content:" ok";color:var(--ok);font-size:11px}.question-card{border:1px solid rgba(255,255,255,.12);border-radius:18px;background:linear-gradient(135deg,rgba(255,247,222,.97),rgba(224,199,142,.97));color:var(--ink);padding:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}.round{color:#8b5c12;font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.question-card h2{font-family:Georgia,serif;font-size:31px;line-height:1.15;margin:8px 0 14px}.timer{height:10px;border-radius:999px;background:rgba(45,28,9,.18);overflow:hidden}.timer span{display:block;height:100%;background:linear-gradient(90deg,#c58a2d,#ffe08a);transition:width .2s}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.answer{border:1px solid rgba(45,28,9,.22);border-radius:12px;background:#fff9e6;color:var(--ink);min-height:64px;padding:13px;text-align:left;font-weight:900;font-size:15px;cursor:pointer}.answer.correct{background:#dcf5df;border-color:#24823a}.answer.wrong{background:#f5d8d4;border-color:#a93b32}.answer:disabled{cursor:default}.feedback{min-height:22px;color:var(--muted);font-weight:800}
    .result{display:grid;place-items:center;min-height:360px;text-align:center}.result h2{font-family:Georgia,serif;color:var(--gold);font-size:44px;margin:0 0 8px}.result p{color:var(--muted);font-size:18px}.hidden{display:none!important}
    @media(max-width:800px){.game{align-content:start;padding:12px}.brand h1{font-size:42px}.lobby{grid-template-columns:1fr}.mode{min-height:92px}.side{grid-row:auto}.answers{grid-template-columns:1fr}.match-top{grid-template-columns:1fr}.question-card h2{font-size:25px}.stage{padding:13px}}
  </style>
</head>
<body>
  <main class="game">
    <div class="hud"><a class="back" href="/">Hub</a><span class="pill" id="online-count">Online: ...</span></div>
    <div class="brand"><p>Bíblia, Reforma e Luteranismo</p><h1>Quiz Ortodoxia</h1></div>
    <section class="stage" id="lobby">
      <div class="lobby">
        <div>
          <div class="modes">
            <button class="mode active" data-mode="solo"><span><strong>Solo</strong>Treino rápido contra o relógio, sem recompensa ranqueada.</span><i>1</i></button>
            <button class="mode" data-mode="duel"><span><strong>Duelo online</strong>Entre na fila para enfrentar outro jogador nas mesmas perguntas.</span><i>2</i></button>
            <button class="mode" data-mode="general"><span><strong>Competição geral</strong>Eliminatória: errou, cai; vence o último que permanecer.</span><i>∞</i></button>
          </div>
          <div class="launch">
            <div><div class="status-title" id="status-title">Solo selecionado</div><div class="status-text" id="status-text">Comece quando quiser.</div></div>
            <div><button class="btn primary" id="main-action">Jogar</button><button class="btn danger hidden" id="cancel-queue">Sair da fila</button></div>
          </div>
        </div>
        <aside class="side">
          <div class="box"><p class="label">Jogadores online</p><div id="online" class="online"><span class="status-text">Procurando...</span></div></div>
          <div class="box hidden" id="invite-box"><p class="label">Convites</p><div id="invites"></div></div>
          <div class="toast" id="toast"></div>
        </aside>
      </div>
    </section>
    <section class="stage match hidden" id="match">
      <div class="match-top">
        <div class="scoreline" id="scoreboard"></div>
        <button class="btn" id="leave-match">Sair</button>
      </div>
      <article class="question-card">
        <div class="round" id="round-label">Rodada</div>
        <h2 id="question">Aguardando pergunta...</h2>
        <div class="timer"><span id="timer-bar"></span></div>
        <div class="answers" id="answers"></div>
      </article>
      <div class="feedback" id="feedback"></div>
    </section>
    <section class="stage result hidden" id="result">
      <div><h2 id="result-title">Resultado</h2><p id="result-text"></p><button class="btn primary" id="play-again">Jogar de novo</button></div>
    </section>
  </main>
  <script>
    const $=s=>document.querySelector(s);
    const api=(url,options={})=>fetch(url,{headers:{'Content-Type':'application/json'},cache:'no-store',...options}).then(async r=>{const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Falha no servidor');return data});
    const S={mode:'solo',match:null,lobby:null,completed:null};
    const modeName=m=>m==='general'?'Competição geral':m==='duel'?'Duelo online':m==='invite'?'Convite':'Solo';
    function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function toast(text=''){ $('#toast').textContent=text; }
    function show(screen){['#lobby','#match','#result'].forEach(id=>$(id).classList.toggle('hidden',id!==screen))}
    function chooseMode(mode){S.mode=mode;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#status-title').textContent=modeName(mode)+' selecionado';$('#status-text').textContent=mode==='solo'?'Comece quando quiser.':mode==='duel'?'Você será pareado com outro jogador online.':'Eliminatória: cada erro desclassifica na hora.';$('#cancel-queue').classList.add('hidden');toast('')}
    async function refreshLobby(){try{const data=await api('/api/quiz/lobby');S.lobby=data;renderOnline(data);if(data.activeMatch&&!S.completed){setMatch(data.activeMatch);return}if(data.queue){$('#status-title').textContent=data.queue.mode==='duel'?'Fila de duelo':'Fila geral';$('#status-text').textContent=data.queue.mode==='duel'?'Esperando outro jogador.':'Esperando fechar a janela com pelo menos 2 jogadores.';$('#cancel-queue').classList.remove('hidden')}}catch(e){toast('Conexão instável. Tentando reconectar...')}}
    function renderOnline(data){$('#online-count').textContent=`Online: ${data.online.length+1}`;$('#online').innerHTML=data.online.length?data.online.map(p=>`<div class="online-row"><span><i class="dot"></i>${esc(p.name)}</span><button class="btn" data-invite="${p.id}">Convidar</button></div>`).join(''):'<span class="status-text">Só você online agora.</span>';$('#invite-box').classList.toggle('hidden',!data.invites.length);$('#invites').innerHTML=data.invites.map(i=>`<div class="online-row"><span>${esc(i.from.name)}</span><span><button class="btn primary" data-accept="${i.id}">Aceitar</button> <button class="btn" data-decline="${i.id}">Recusar</button></span></div>`).join('')}
    function setMatch(match){S.match=match;show('#match');renderMatch(match)}
    function renderMatch(match){S.match=match;if(match.status==='complete'){renderComplete(match);return}$('#round-label').textContent=`${modeName(match.mode)} · pergunta ${match.round}/${match.totalRounds}`;$('#question').textContent=match.question?.q||'Aguardando...';const pct=Math.max(0,Math.min(100,match.msLeft/(match.roundSeconds*1000)*100));$('#timer-bar').style.width=pct+'%';$('#answers').innerHTML=(match.question?.a||[]).map((a,i)=>{const cls=match.reveal&&i===match.correctIndex?' correct':match.reveal&&match.userAnswer===i&&i!==match.correctIndex?' wrong':'';return `<button class="answer${cls}" data-answer="${i}" ${match.answered||match.reveal||match.eliminated?'disabled':''}>${esc(a)}</button>`}).join('');$('#feedback').textContent=match.eliminated?'Você foi desclassificado. Acompanhe até sobrar o vencedor.':match.answered&&!match.reveal?'Resposta enviada.':match.reveal?'Resposta revelada. Próxima pergunta...':'';$('#scoreboard').innerHTML=match.players.map(p=>`<span class="player ${S.lobby?.user?.id===p.id?'me':''} ${p.answered?'done':''}">${esc(p.name)} · ${p.score}${p.eliminated?' · eliminado':''}</span>`).join('')}
    function renderComplete(match){S.completed=match.id;const sorted=[...match.players].sort((a,b)=>b.score-a.score);const alive=match.mode==='general'?match.players.filter(p=>!p.eliminated&&!p.left):[];const me=match.players.find(p=>p.id===S.lobby?.user?.id);const winner=alive.length===1?alive[0]:sorted[0];const tied=alive.length!==1&&sorted.length>1&&sorted[0].score===sorted[1].score;show('#result');$('#result-title').textContent=tied?'Empate':'Partida encerrada';const reward=!tied&&winner?.id===me?.id&&match.mode!=='solo'?' Você ganhou +10 pontos no Hub.':'';$('#result-text').textContent=tied?`Empate com ${winner?.score||0} pontos.`:`${winner?.name||'Jogador'} venceu${match.mode==='general'?' a eliminatória':''} com ${winner?.score||0} pontos.${reward}`;S.match=null;refreshLobby()}
    async function pollMatch(){if(!S.match)return;try{const data=await api('/api/quiz/match?id='+encodeURIComponent(S.match.id));renderMatch(data.match)}catch(e){toast(e.message);S.match=null;show('#lobby')}}
    async function mainAction(){try{S.completed=null;if(S.mode==='solo'){const data=await api('/api/quiz/solo',{method:'POST',body:'{}'});setMatch(data.match);return}const data=await api('/api/quiz/queue',{method:'POST',body:JSON.stringify({mode:S.mode})});if(data.match)setMatch(data.match);else{$('#status-title').textContent='Na fila';$('#status-text').textContent='Aguardando pareamento.';$('#cancel-queue').classList.remove('hidden')}}catch(e){$('#status-title').textContent='Perguntas em revisão';$('#status-text').textContent=e.message;toast('')}}
    async function cancelQueue(){await api('/api/quiz/cancel-queue',{method:'POST',body:'{}'});chooseMode(S.mode);refreshLobby()}
    async function leaveMatch(){const matchId=S.match?.id;if(matchId){try{await api('/api/quiz/leave',{method:'POST',body:JSON.stringify({matchId})})}catch(e){toast(e.message)}}S.match=null;S.completed=matchId||S.completed;show('#lobby');chooseMode(S.mode);refreshLobby()}
    async function answer(i){if(!S.match)return;try{const data=await api('/api/quiz/answer',{method:'POST',body:JSON.stringify({matchId:S.match.id,answerIndex:i})});renderMatch(data.match)}catch(e){$('#feedback').textContent=e.message}}
    document.addEventListener('click',async e=>{const mode=e.target.closest('[data-mode]');if(mode)chooseMode(mode.dataset.mode);const ans=e.target.closest('[data-answer]');if(ans)answer(Number(ans.dataset.answer));const inv=e.target.closest('[data-invite]');if(inv){await api('/api/quiz/invite',{method:'POST',body:JSON.stringify({toUserId:inv.dataset.invite})});toast('Convite enviado.')}const acc=e.target.closest('[data-accept]');if(acc){const data=await api('/api/quiz/invite/respond',{method:'POST',body:JSON.stringify({inviteId:acc.dataset.accept,accept:true})});if(data.match)setMatch(data.match)}const dec=e.target.closest('[data-decline]');if(dec){await api('/api/quiz/invite/respond',{method:'POST',body:JSON.stringify({inviteId:dec.dataset.decline,accept:false})});refreshLobby()}});
    $('#main-action').addEventListener('click',mainAction);$('#cancel-queue').addEventListener('click',cancelQueue);$('#play-again').addEventListener('click',()=>{S.completed=null;show('#lobby');chooseMode(S.mode);refreshLobby()});$('#leave-match').addEventListener('click',leaveMatch);
    chooseMode('solo');refreshLobby();setInterval(refreshLobby,2500);setInterval(pollMatch,700);
  </script>
</body>
</html>
